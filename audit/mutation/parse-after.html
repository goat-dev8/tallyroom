 a length of 2 but got 4","status":"Killed","static":true,"testsCompleted":38,"killedBy":["61"],"coveredBy":["2","14","15","16","18","35","61","62","76","77","157"],"location":{"end":{"column":162,"line":275},"start":{"column":151,"line":275}}}],"source":"import { BallotGroup, Mark } from './types.js';\nexport class ParseError extends Error {\n  constructor(public line: number, msg: string, public column?: number, public candidate?: string) {\n    super(`Line ${line}: ${msg}`);\n    this.name = 'ParseError';\n  }\n}\nconst clean = (s: string) => s.trim().replace(/^\"(.*)\"$/s, '$1').normalize('NFC');\n\n/** Ballot token for an unresolved write-in. Counted only when listed in the declared candidates. */\nexport const WRITE_IN = 'Write-in';\n\n/**\n * \"Write-in\" may appear on a ballot without being a continuing candidate (Alaska: those marks are passed over).\n * It joins the continuing set only when the caller lists it in `declared` (New York City counts that row).\n */\nexport function writeInContinues(name: string, declared?: string[]): boolean {\n  return name === WRITE_IN && !!declared?.includes(WRITE_IN);\n}\n\nfunction remember(seen: string[], name: string, declared?: string[]) {\n  if (name === WRITE_IN && !writeInContinues(name, declared)) return;\n  if (!seen.includes(name)) seen.push(name);\n}\n\n/** Parse `count,A>B>C` lines. `[A=B]` or `overvote` is an overvote, `_` or `undervote` a skipped rank. Quoted names may contain commas. */\n/** Optional header line of the ranking format, e.g. `count,ranking` (BUG-002: it used to be read as a ballot). */\nexport const RANKING_FORMAT_HEADER = /^\\s*\"?(?:count|weight|ballots|votes|qty|quantity)\"?\\s*,\\s*\"?(?:ranking|rankings|ranks|order|preferences?|ballot)\"?\\s*$/i;\n\n/** Counts are added up across ballots, so each one (and the total) must stay an exact JS integer (BUG-004). */\nexport function assertSafeCounts(ballots: BallotGroup[]): void {\n  let total = 0;\n  ballots.forEach((b, i) => {\n    total += b.count;\n    if (!Number.isSafeInteger(b.count) || !Number.isSafeInteger(total))\n      throw new BallotSemanticError(`Ballot ${i + 1}: count must be a positive integer of at most ${Number.MAX_SAFE_INTEGER} in total`, i + 1, undefined, undefined, 'INVALID_COUNT');\n  });\n}\n\nexport function parseBallots(text: string, declared?: string[]): { ballots: BallotGroup[]; candidates: string[] } {\n  const ballots: BallotGroup[] = []; const seen: string[] = [];\n  const lines = text.replace(/^\\uFEFF/, '').split(/\\r?\\n/);\n  let first = true;\n  lines.forEach((raw, i) => {\n    const line = raw.trim(); if (!line || line.startsWith('#')) return;\n    if (first) { first = false; if (RANKING_FORMAT_HEADER.test(line)) return; }\n    const comma = line.indexOf(','); if (comma <"+" 0) throw new ParseError(i + 1, 'expected \"count,ranking\"');\n    const countStr = line.slice(0, comma).trim();\n    if (!/^[1-9]\\d*$/.test(countStr)) throw new ParseError(i + 1, 'count must be a positive integer', 1);\n    const marks: Mark[] = line.slice(comma + 1).split('>').map((tok, idx) => {\n      const t = tok.trim();\n      if (t === '_' || t === '' || /^undervote$/i.test(t)) return { kind: 'skip' } as Mark;\n      if (/^\\[.*\\]$/.test(t) || /^overvote$/i.test(t)) return { kind: 'overvote' } as Mark;\n      const name = clean(t);\n      if (declared && !declared.includes(name) && name !== WRITE_IN) throw new ParseError(i + 1, `unknown candidate \"${name}\"`, idx + 1, name);\n      remember(seen, name, declared);\n      return { kind: 'candidate', name } as Mark;\n    });\n    ballots.push({ count: Number(countStr), marks });\n  });\n  if (ballots.length === 0) throw new BallotSemanticError('No valid ballots to count');\n  assertSafeCounts(ballots);\n  return { ballots, candidates: declared ?? seen };\n}\n\n/** Well-formed ballot input that cannot be counted (empty file, bad count, unknown candidate). */\nexport class BallotSemanticError extends Error {\n  constructor(message: string, public row?: number, public column?: number, public candidate?: string, public code?: string) {\n    super(message);\n    this.name = 'BallotSemanticError';\n  }\n}\n\nconst RANK_HEADER = /^(?:rank|choice|preference|pref)\\s*\\d+$|^\\d+\\s*(?:(?:st|nd|rd|th)(?:\\s*(?:choice|rank|preference|pref))?|\\s+(?:choice|rank|preference|pref))$|^(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth)(?:\\s+(?:choice|rank|preference))?$/i;\nconst COUNT_HEADER = /^(?:count|weight|ballots|votes|qty|quantity)$/i;\nconst IGNORE_HEADER = /^(?:id|ballot|ballot[_\\s-]?id|#|precinct|style)$/i;\nconst SKIP_CELL = /^(?:_|undervote|skip|blank)$/i;\n\nfunction marksFromRanking(ranking: string, declared: string[] | undefined, row: number): Mark[] {\n  let parsed: { ballots: BallotGroup[] };\n  try { parsed = parseBallots(`1,${ranking}`, declared); }\n  catch (e) {\n    if (e instanceof ParseError) throw new BallotSemanticError(`Ballot ${row}: ${e.message.replace(/^Line \\d+: /, '')}`, row, e.column, e.candidate);\n    throw e;\n  }\n  return parsed.ballots[0].marks;\n}\n\nfunction cellMark(cell: string, declared: string[] | undefined, row: number, column: number): Mark {\n  const t = clean(cell);\n  if (t === '' || SKIP_CELL.test(t)) return { kind: 'skip' };\n  if (/^overvote$/i.test(t) || /^\\[.*\\]$/.test(t)) return { kind: 'overvote' };\n  if (declared && !declared.includes(t) && t !== WRITE_IN) {\n    throw new BallotSemanticError(`Row ${row}, column ${column}: unknown candidate \"${t}\"`, row, column, t);\n  }\n  return { kind: 'candidate', name: t };\n}\n\nfunction collectCandidates(ballots: BallotGroup[], declared?: string[]): string[] {\n  if (declared) return declared;\n  const seen: string[] = [];\n  for (const b of ballots) for (const m of b.marks) if (m.kind === 'candidate') remember(seen, m.name, declared);\n  return seen;\n}\n\nconst COLUMN_HINT = 'count,rank1,rank2,...';\nconst POSITIVE_INT = /^[1-9]\\d*$/;\nconst PURE_NUMBER = /^\\d+$/;\n\nfunction arrowColumn(cells: string[]): number | undefined {\n  const i = cells.findIndex(c => c.includes('>'));\n  return i <"+" 0 ? undefined : i + 1;\n}\n\nfunction ambiguousCsv(row: number, column: number | undefined, why: string) {\n  throw new BallotSemanticError(\n    `Row ${row}${column ? `, column ${column}` : ''}: ${why} Use ranking lines such as \"5,A>B\", or one candidate per column: ${COLUMN_HINT}`,\n    row,\n    column,\n    undefined,\n    'CSV_FORMAT_AMBIGUOUS',\n  );\n}\n\n/**\n * Parse a CSV file whose columns are ranks (optional header, optional count column).\n * A headerless file of `count,A>B` lines is the ranking format, not two candidate names.\n */\nexport function parseRankCsv(text: string, declared?: string[]): { ballots: BallotGroup[]; candidates: string[] } {\n  const rows = parseCsvRows(text);\n  const useful = rows.map((cells, index) => ({ cells, row: index + 1 })).filter(({ cells }) => {\n    const trimmed = cells.map(c => c.trim());\n    if (trimmed.every(c => c === '')) return false;\n    if (trimmed[0].startsWith('#') && trimmed.slice(1).every(c => c === '')) return false;\n    return true;\n  });\n  if (useful.length === 0) throw new BallotSemanticError('No valid ballots to count');\n  if (RANKING_FORMAT_HEADER.test(useful[0].cells.join(','))) return parseBallots(text, declared);\n  const header = looksLikeRankHeader(useful[0].cells) ? useful[0].cells.map(c => c.trim()) : null;\n  const data = header ? useful.slice(1) : useful;\n  if (data.length === 0) throw new BallotSemanticError('No valid ballots to count');\n  if (!header) {\n    const ranking = data.every(({ cells }) => cells.length === 2 && PURE_NUMBER.test(cells[0].trim()));\n    // Every row is \"count,ranking\". A single-choice line (\"3,A\") has no \">\", but a headerless rank-column file\n    // can never start with a numeric candidate (rejected below), so a leading integer always means a count (parseBallots rejects 0 with a line number).\n    const numericNames = ranking && data.some(({ cells }) => cells[1].split('>').some(t => PURE_NUMBER.test(t.trim())));\n    if (ranking && !numericNames) return parseBallots(text, declared);\n  }\n  for (const { cells, row } of data) {\n    const column = arrowColumn(cells);\n    if (column !== undefined) ambiguousCsv(row, column, '\">\" joins ranks inside one cell, so this is not one candidate per column.');\n  }\n  if (!header) {\n    for (const { cells, row } of data) {\n      const name = cells[0]?.trim() ?? '';\n      if (PURE_NUMBER.test(name)) {\n        throw new BallotSemanticError(\n          `Row ${row}, column 1: candidate name \"${name}\" is purely numeric. With no header, a leading count belongs in ${COLUMN_HINT}`,\n          row,\n          1,\n          name,\n          'CSV_FORMAT_AMBIGUOUS',\n        );\n      }\n    }\n  }\n  const countCol = header ? header.findIndex(c => COUNT_HEADER.test(c)) : -1;\n  const rankCols = header\n    ? header.map((c, i) => ({ c, i })).filter(({ c, i }) => i !== countCol && !IGNORE_HEADER.test(c)).map(({ i }) => i)\n    : null;\n  const ballots: BallotGroup[] = data.map(({ cells, row }) => {\n    let count = 1;\n    if (countCol >= 0) {\n      const raw = (cells[countCol] ?? '').trim();\n      if (!/^[1-9]\\d*$/.test(raw)) throw new BallotSemanticError(`Row ${row}, column ${countCol + 1}: count must be a positive integer`, row, countCol + 1);\n      count = Number(raw);\n    }\n    const indexes = rankCols ?? cells.map((_, i) => i);\n    const marks = indexes.map(i => cellMark(cells[i] ?? '', declared, row, i + 1));\n    return { count, marks };\n  });\n  assertSafeCounts(ballots);\n  return { ballots, candidates: collectCandidates(ballots, declared) };\n}\n\nfunction looksLikeRankHeader(row: string[]): boolean {\n  const cells = row.map(c => c.trim()).filter(Boolean);\n  if (cells.length === 0) return false;\n  const known = (c: string) => RANK_HEADER.test(c) || COUNT_HEADER.test(c) || IGNORE_HEADER.test(c);\n  return cells.every(known) && cells.some(c => RANK_HEADER.test(c) || COUNT_HEADER.test(c));\n}\n\n/** RFC-style CSV rows. Throws ParseError on an unterminated quote. */\nexport function parseCsvRows(text: string): string[][] {\n  const src = text.replace(/^\\uFEFF/, '');\n  const rows: string[][] = [];\n  let row: string[] = [];\n  let cell = '';\n  let inQuotes = false;\n  let line = 1;\n  let col = 1;\n  let quoteLine = 1;\n  let quoteCol = 1;\n  for (let i = 0; i <"+" src.length; i++) {\n    const c = src[i];\n    if (inQuotes) {\n      if (c === '\"') {\n        if (src[i + 1] === '\"') { cell += '\"'; i++; col += 2; continue; }\n        inQuotes = false; col++; continue;\n      }\n      cell += c;\n      if (c === '\\n') { line++; col = 1; } else col++;\n      continue;\n    }\n    if (c === '\"') { inQuotes = true; quoteLine = line; quoteCol = col; col++; continue; }\n    if (c === ',') { row.push(cell); cell = ''; col++; continue; }\n    if (c === '\\n' || c === '\\r') {\n      if (c === '\\r' && src[i + 1] === '\\n') i++;\n      row.push(cell); cell = ''; rows.push(row); row = []; cell = '';\n      line++; col = 1; continue;\n    }\n    cell += c; col++;\n  }\n  if (inQuotes) throw new ParseError(quoteLine, 'unterminated quoted field', quoteCol);\n  if (cell.length > 0 || row.length > 0) { row.push(cell); rows.push(row); }\n  return rows;\n}\n\n/**\n * JSON ballots: a ranking string (`count,A>B`), an array of ballots, or `{ csv }`.\n * Array items are `[\"A\",\"B\"]`, `\"A>B\"`, or `{ count, ranks | ranking }`.\n */\nexport function parseBallotJson(ballots: unknown, declared?: string[]): { ballots: BallotGroup[]; candidates: string[] } {\n  if (typeof ballots === 'string') return parseBallots(ballots, declared);\n  if (!Array.isArray(ballots)) throw new BallotSemanticError('Field \"ballots\" must be a ranking string or an array of ballots');\n  if (ballots.length === 0) throw new BallotSemanticError('No valid ballots to count');\n  const groups: BallotGroup[] = ballots.map((item, i) => {\n    const label = `Ballot ${i + 1}`;\n    const row = i + 1;\n    if (typeof item === 'string') return { count: 1, marks: marksFromRanking(item, declared, row) };\n    if (Array.isArray(item)) {\n      const marks = item.map((cell, j) => {\n        if (cell == null || cell === '') return { kind: 'skip' } as Mark;\n        if (typeof cell !== 'string') throw new BallotSemanticError(`${label}: rank ${j + 1} must be a string`, row, j + 1);\n        return cellMark(cell, declared, row, j + 1);\n      });\n      return { count: 1, marks };\n    }\n    if (!item || typeof item !== 'object') throw new BallotSemanticError(`${label}: expected a ranking string, an array of ranks, or { count, ranks }`, row);\n    const o = item as { count?: unknown; ranks?: unknown; ranking?: unknown };\n    let count = 1;\n    if (o.count !== undefined) {\n      if (typeof o.count !== 'number' || !Number.isSafeInteger(o.count) || o.count <"+" 1) throw new BallotSemanticError(`${label}: count must be a positive integer`, row);\n      count = o.count;\n    }\n    if (typeof o.ranking === 'string') return { count, marks: marksFromRanking(o.ranking, declared, row) };\n    if (Array.isArray(o.ranks)) {\n      const marks = o.ranks.map((cell, j) => {\n        if (cell == null || cell === '') return { kind: 'skip' } as Mark;\n        if (typeof cell !== 'string') throw new BallotSemanticError(`${label}: rank ${j + 1} must be a string`, row, j + 1);\n        return cellMark(cell, declared, row, j + 1);\n      });\n      return { count, marks };\n    }\n    throw new BallotSemanticError(`${label}: expected \"ranks\" or \"ranking\"`, row);\n  });\n  assertSafeCounts(groups);\n  return { ballots: groups, candidates: collectCandidates(groups, declared) };\n}\n\n/** Pattern TSV: `count \\t rank1 \\t ... ` with tokens `overvote`, `undervote`, or a candidate name. */\nexport function parsePatternTsv(text: string): BallotGroup[] {\n  return text.split('\\n').filter(Boolean).map(l => {\n    const [c, ...ranks] = l.split('\\t');\n    return { count: Number(c), marks: ranks.map((r): Mark => r === 'undervote' ? { kind: 'skip' } : r === 'overvote' ? { kind: 'overvote' } : { kind: 'candidate', name: r }) };\n  });\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"test/rounds.api.test.ts":{"tests":[{"id":"0","name":"elimination transfers counts a single-candidate elimination onto the next choice"},{"id":"1","name":"elimination transfers sends ballots with no next choice to exhausted"},{"id":"2","name":"GET /api/elections/[id]/rounds serves precomputed JSON that matches a fresh tabulation"},{"id":"3","name":"GET /api/elections/[id]/rounds maine-2018-cd2 matches the certified round tallies and transfer totals"},{"id":"4","name":"GET /api/elections/[id]/rounds alaska-2022 matches the certified tallies and Begich transfer split"},{"id":"5","name":"GET /api/elections/[id]/rounds nyc-2021 matches the certified recap tallies, eliminations, and finalists"},{"id":"6","name":"GET /api/elections/[id]/rounds accepts the fixture slugs as aliases and rejects unknown ids"},{"id":"7","name":"GET /api/elections/[id]/rounds 405 on POST"},{"id":"8","name":"GET /api/elections/[id]/rounds route handler returns the Maine payload"}],"source":"import { describe, it, expect } from 'vitest';\nimport { parseBallots, tabulateIrv } from '../src/index.js';\nimport { eliminationTransfers } from '../src/transfers.js';\nimport { BUNDLED_ELECTIONS } from '../src/elections/registry.js';\nimport { buildRoundsPayload } from '../src/rounds-build.js';\nimport { handleElectionRounds } from '../src/rounds-api.js';\nimport { GET } from '../app/api/elections/[id]/rounds/route.js';\nimport { ALASKA_2022_SPECIAL } from '../src/elections/alaska-2022-special.js';\nimport { MAINE_2018_CD2 } from '../src/elections/maine-2018-cd2.js';\nimport { NYC_2021_DEM_MAYOR } from '../src/elections/nyc-2021-dem-mayor.js';\n\nconst sumTo = (edges: { to: string; count: number }[], to: string) => edges.filter(e => e.to === to).reduce((s, e) => s + e.count, 0);\n\ndescribe('elimination transfers', () => {\n  it('counts a single-candidate elimination onto the next choice', () => {\n    const { ballots, candidates } = parseBallots('8,A>D\\n6,B>C\\n4,C>B\\n3,D>C');\n    const result = tabulateIrv(ballots, candidates);\n    expect(eliminationTransfers(ballots, candidates, {}, result.rounds, 1)).toEqual([{ from: 'D', to: 'C', count: 3 }]);\n    expect(eliminationTransfers(ballots, candidates, {}, result.rounds, 2)).toEqual([{ from: 'B', to: 'C', count: 6 }]);\n    expect(eliminationTransfers(ballots, candidates, {}, result.rounds, 0)).toEqual([]);\n  });\n\n  it('sends ballots with no next choice to exhausted', () => {\n    const { ballots, candidates } = parseBallots('7,A\\n6,B\\n4,C>A\\n3,D');\n    const result = tabulateIrv(ballots, candidates);\n    expect(eliminationTransfers(ballots, candidates, {}, result.rounds, 1)).toEqual([{ from: 'D', to: 'exhausted', count: 3 }]);\n  });\n});\n\ndescribe('GET /api/elections/[id]/rounds', () => {\n  it('serves precomputed JSON that matches a fresh tabulation', () => {\n    for (const e of BUNDLED_ELECTIONS) {\n      const served = handleElectionRounds('GET', e.id);\n      expect(served.status).toBe(200);\n      expect(served.body).toEqual(buildRoundsPayload(e));\n    }\n  });\n\n  it('maine-2018-cd2 matches the certified round tallies and transfer totals', () => {\n    const body = handleElectionRounds('GET', 'maine-2018-cd2').body as ReturnType<"+"typeof buildRoundsPayload>;\n    expect(body.winner).toBe('DEM Golden, Jared F.');\n    expect(body.totalBallots).toBe(296077);\n    expect(body.rounds).toHaveLength(2);\n    expect(body.rounds[0].tallies).toEqual(MAINE_2018_CD2.certified.round1);\n    expect(body.rounds[0].transfers).toEqual([]);\n    expect([...body.rounds[0].eliminated].sort()).toEqual(['Bond, Tiffany L.', 'Hoar, William R.S.']);\n    expect(body.rounds[1].tallies).toEqual(MAINE_2018_CD2.certified.final);\n    const edges = body.rounds[1].transfers;\n    expect(sumTo(edges, 'REP Poliquin, Bruce')).toBe(4747);\n    expect(sumTo(edges, 'DEM Golden, Jared F.')).toBe(10427);\n    expect(sumTo(edges, 'exhausted')).toBe(8253);\n    expect(edges.reduce((s, e) => s + e.count, 0)).toBe(16552 + 6875);\n  });\n\n  it('alaska-2022 matches the certified tallies and Begich transfer split', () => {\n    const body = handleElectionRounds('GET', 'alaska-2022').body as ReturnType<"+"typeof buildRoundsPayload>;\n    expect(body.winner).toBe('Peltola, Mary S.');\n    expect(body.totalBallots).toBe(192289);\n    expect(body.rounds[0].tallies).toEqual(ALASKA_2022_SPECIAL.certified.rounds[0].tallies);\n    expect(body.rounds[0].eliminated).toEqual(['Begich, Nick']);\n    expect(body.rounds[1].tallies).toEqual(ALASKA_2022_SPECIAL.certified.rounds[1].tallies);\n    // 11,290 = official exhausted 11,243 + overvotes 47. Both leave the continuing pile.\n    expect(body.rounds[1].transfers).toEqual([\n      { from: 'Begich, Nick', to: 'Palin, Sarah', count: 27053 },\n      { from: 'Begich, Nick', to: 'Peltola, Mary S.', count: 15467 },\n      { from: 'Begich, Nick', to: 'exhausted', count: 11290 },\n    ]);\n    expect(27053 + 15467 + 11290).toBe(53810);\n  });\n\n  it('nyc-2021 matches the certified recap tallies, eliminations, and finalists', () => {\n    const body = handleElectionRounds('GET', 'nyc-2021').body as ReturnType<"+"typeof buildRoundsPayload>;\n    expect(body.winner).toBe('Eric L. Adams');\n    expect(body.totalBallots).toBe(947932);\n    expect(body.rounds).toHaveLength(8);\n    NYC_2021_DEM_MAYOR.certified.rounds.forEach((cr, i) => {\n      expect(body.rounds[i].tallies).toEqual(cr.tallies);\n      expect([...body.rounds[i].eliminated].sort()).toEqual([...cr.eliminated].sort());\n    });\n    const writeIn = body.rounds[1].transfers.filter(t => t.from === 'Write-in');\n    expect(writeIn.reduce((s, t) => s + t.count, 0)).toBe(1568);\n    expect(writeIn.some(t => t.to === 'exhausted')).toBe(true);\n  });\n\n  it('accepts the fixture slugs as aliases and rejects unknown ids', () => {\n    expect(handleElectionRounds('GET', 'alaska-2022-special').body).toEqual(handleElectionRounds('GET', 'alaska-2022').body);\n    expect(handleElectionRounds('GET', 'nyc-2021-dem-mayor').body).toEqual(handleElectionRounds('GET', 'nyc-2021').body);\n    expect(handleElectionRounds('GET', 'no-such').status).toBe(404);\n    expect(handleElectionRounds('GET', 'no-such').body).toEqual({ error: { code: 'UNKNOWN_ELECTION', message: 'Unknown election \"no-such\"', details: { id: 'no-such' } } });\n  });\n\n  it('405 on POST', () => {\n    const r = handleElectionRounds('POST', 'maine-2018-cd2');\n    expect(r.status).toBe(405);\n    expect(r.headers).toEqual({ Allow: 'GET' });\n  });\n\n  it('route handler returns the Maine payload', async () => {\n    const res = await GET(new Request('http://localhost/api/elections/maine-2018-cd2/rounds'), {\n      params: Promise.resolve({ id: 'maine-2018-cd2' }),\n    });\n    expect(res.status).toBe(200);\n    const body = await res.json();\n    expect(body.id).toBe('maine-2018-cd2');\n    expect(body.winner).toBe('DEM Golden, Jared F.');\n    expect(body.rounds[1].transfers.some((t: { to: string }) => t.to === 'exhausted')).toBe(true);\n  });\n});\n"},"test/api.test.ts":{"tests":[{"id":"9","name":"POST /api/tabulate contract counts T02 and echoes rules with defaults"},{"id":"10","name":"POST /api/tabulate contract 405 with Allow header on GET"},{"id":"11","name":"POST /api/tabulate contract 400 on bad JSON, unknown rule key, parse error"},{"id":"12","name":"POST /api/tabulate contract STV path and seats validation"},{"id":"13","name":"POST /api/tabulate contract 413 above 4 MB, under the platform body limit"}],"source":"import { describe, it, expect } from 'vitest';\nimport { handleTabulate } from '../src/api.js';\ndescribe('POST /api/tabulate contract', () => {\n  it('counts T02 and echoes rules with defaults', () => {\n    const r = handleTabulate('POST', JSON.stringify({ ballots: '8,A>D\\n6,B>C\\n4,C>B\\n3,D>C' })) as any;\n    expect(r.status).toBe(200); expect(r.body.winner).toBe('C'); expect(r.body.rounds).toHaveLength(3);\n    expect(r.body.rules).toEqual({ overvote: 'exhaust', skips: 'continue', batch: false, tiebreak: 'previous-round' }); expect(r.body.engineVersion).toBe('0.1.0');\n  });\n  it('405 with Allow header on GET', () => { const r = handleTabulate('GET', ''); expect(r.status).toBe(405); expect(r.headers).toEqual({ Allow: 'POST' }); });\n  it('400 on bad JSON, unknown rule key, parse error', () => {\n    expect(handleTabulate('POST', '{x').body).toEqual({ error: { code: 'INVALID_JSON', message: 'Invalid JSON body', details: null } });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: '1,A', rules: { foo: 1 } })).body).toEqual({ error: { code: 'UNKNOWN_RULE', message: 'Unknown rule key(s): foo', details: { keys: ['foo'] } } });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: 'x,A' })).body).toEqual({ error: { code: 'INVALID_COUNT', message: 'Line 1: count must be a positive integer', details: { row: 1, column: 1 } } });\n  });\n  it('STV path and seats validation', () => {\n    const ok = handleTabulate('POST', JSON.stringify({ ballots: '3,A>B\\n3,A>C\\n2,B\\n1,C\\n4,D', seats: 2 })) as any;\n    expect(ok.status).toBe(200); expect([...ok.body.winners].sort()).toEqual(['A', 'D']);\n    expect(handleTabulate('POST', JSON.stringify({ ballots: '1,A\\n1,B', seats: 3 })).body).toEqual({ error: { code: 'SEATS_OUT_OF_RANGE', message: 'Seats must be between 1 and 2', details: null } });\n  });\n  it('413 above 4 MB, under the platform body limit', () => {\n    const over = handleTabulate('POST', 'x'.repeat(4 * 1024 * 1024 + 1));\n    expect(over.status).toBe(413);\n    expect(over.body).toEqual({ error: { code: 'PAYLOAD_TOO_LARGE', message: 'Ballot file too large (max 4 MB)', details: { maxBytes: 4 * 1024 * 1024 } } });\n    expect(handleTabulate('POST', 'x'.repeat(4 * 1024 * 1024)).status).not.toBe(413);\n  });\n});\n"},"test/election-tabulate.api.test.ts":{"tests":[{"id":"14","name":"POST /api/elections/[id]/tabulate counts Maine from the bundled fixture"},{"id":"15","name":"POST /api/elections/[id]/tabulate counts Alaska, including the alias"},{"id":"16","name":"POST /api/elections/[id]/tabulate counts New York City without a request body"},{"id":"17","name":"POST /api/elections/[id]/tabulate 404 for an unknown id and 405 for GET"},{"id":"18","name":"POST /api/elections/[id]/tabulate route handler counts Alaska"}],"source":"import { describe, it, expect } from 'vitest';\nimport { handleElectionTabulate } from '../src/elections/tabulate.js';\nimport { POST } from '../app/api/elections/[id]/tabulate/route.js';\nimport { ALASKA_2022_SPECIAL as AK } from '../src/elections/alaska-2022-special.js';\nimport { MAINE_2018_CD2 as ME } from '../src/elections/maine-2018-cd2.js';\nimport { NYC_2021_DEM_MAYOR as NYC } from '../src/elections/nyc-2021-dem-mayor.js';\n\ndescribe('POST /api/elections/[id]/tabulate', () => {\n  it('counts Maine from the bundled fixture', () => {\n    const r = handleElectionTabulate('POST', 'maine-2018-cd2') as any;\n    expect(r.status).toBe(200);\n    expect(r.body.id).toBe('maine-2018-cd2');\n    expect(r.body.method).toBe('irv');\n    expect(r.body.totalBallots).toBe(296077);\n    expect(r.body.rounds).toHaveLength(2);\n    expect(r.body.rounds[0].tallies).toEqual(ME.certified.round1);\n    expect(r.body.rounds[1].tallies).toEqual(ME.certified.final);\n    expect(r.body.winner).toBe('DEM Golden, Jared F.');\n    expect(r.body.certifiedWinner).toBe(r.body.winner);\n  });\n\n  it('counts Alaska, including the alias', () => {\n    const r = handleElectionTabulate('POST', 'alaska-2022-special') as any;\n    expect(r.status).toBe(200);\n    expect(r.body.id).toBe('alaska-2022');\n    expect(r.body.totalBallots).toBe(192289);\n    expect(r.body.rounds).toHaveLength(2);\n    expect(r.body.rounds[0].tallies).toEqual(AK.certified.rounds[0].tallies);\n    expect(r.body.rounds[1].tallies).toEqual({ 'Palin, Sarah': 86026, 'Peltola, Mary S.': 91266 });\n    expect(r.body.winner).toBe('Peltola, Mary S.');\n  });\n\n  it('counts New York City without a request body', () => {\n    const r = handleElectionTabulate('POST', 'nyc-2021') as any;\n    expect(r.status).toBe(200);\n    expect(r.body.totalBallots).toBe(947932);\n    expect(r.body.rounds).toHaveLength(8);\n    NYC.certified.rounds.forEach((cr: { tallies: Record<"+"string, number>; eliminated: string[] }, i: number) => {\n      expect(r.body.rounds[i].tallies).toEqual(cr.tallies);\n      expect([...r.body.rounds[i].eliminated].sort()).toEqual([...cr.eliminated].sort());\n    });\n    expect(r.body.winner).toBe('Eric L. Adams');\n    expect(r.body.rounds[7].tallies).toEqual({ 'Eric L. Adams': 404513, 'Kathryn A. Garcia': 397316 });\n  });\n\n  it('404 for an unknown id and 405 for GET', () => {\n    expect(handleElectionTabulate('POST', 'nope').status).toBe(404);\n    expect(handleElectionTabulate('POST', 'nope').body).toEqual({ error: { code: 'UNKNOWN_ELECTION', message: 'Unknown election \"nope\"', details: { id: 'nope' } } });\n    const got = handleElectionTabulate('GET', 'maine-2018-cd2');\n    expect(got.status).toBe(405);\n    expect(got.headers).toEqual({ Allow: 'POST' });\n  });\n\n  it('route handler counts Alaska', async () => {\n    const res = await POST(new Request('http://localhost/api/elections/alaska-2022/tabulate', { method: 'POST' }), {\n      params: Promise.resolve({ id: 'alaska-2022' }),\n    });\n    expect(res.status).toBe(200);\n    const body = await res.json();\n    expect(body.winner).toBe('Peltola, Mary S.');\n    expect(body.totalBallots).toBe(192289);\n  });\n});\n"},"test/stv.properties.test.ts":{"tests":[{"id":"19","name":"STV invariants (property-based) fills exactly `seats` distinct seats from the candidate list"},{"id":"20","name":"STV invariants (property-based) Droop quota is floor(valid/(seats+1))+1 and Hare is valid/seats"},{"id":"21","name":"STV invariants (property-based) conservation: hopeful tallies + exhausted + quota kept by earlier winners = total ballots"},{"id":"22","name":"STV invariants (property-based) exhausted value never decreases from one round to the next"},{"id":"23","name":"STV invariants (property-based) a candidate elected on quota reached the quota in that round"},{"id":"24","name":"STV invariants (property-based) the eliminated candidate has the lowest tally of that round"},{"id":"25","name":"STV invariants (property-based) a candidate with a Droop quota of first preferences always wins a seat"},{"id":"26","name":"STV invariants (property-based) ballot order never changes the result (byte-identical)"},{"id":"27","name":"STV invariants (property-based) splitting a ballot group into two groups gives the same result"},{"id":"28","name":"STV invariants (property-based) scaling every count by k scales the Hare quota and every tally by k (same winners)"},{"id":"29","name":"STV exact surplus conservation (no rounding) every round: Σ hopeful + exhausted + quota × seats already filled = ballots, exactly"},{"id":"30","name":"STV exact surplus conservation (no rounding) display values are the exact values rounded to 4 dp"},{"id":"31","name":"STV exact surplus conservation (no rounding) surplus transfer: an elected candidate passes on exactly (tally − quota)"},{"id":"32","name":"STV deterministic ties a tie for last (after A is elected on quota) eliminates the candidate listed later, every time"},{"id":"33","name":"STV deterministic ties with all-equal tallies the eliminated candidate is always the last-listed hopeful"}],"source":"import { describe, it, expect } from 'vitest';\nimport fc from 'fast-check';\nimport { tabulateStv, BallotGroup, Fraction } from '../src/index.js';\n\n// Property-based invariants for multi-seat STV (weighted inclusive Gregory, exact rationals).\n// Tallies are reported at 4 dp, so sums are compared within the rounding bound of the reported values.\nconst C = ['A', 'B', 'C', 'D', 'E'];\nconst ballotArb = fc.record({\n  count: fc.integer({ min: 1, max: 40 }),\n  marks: fc.array(fc.oneof(\n    { weight: 6, arbitrary: fc.constantFrom(...C).map(name => ({ kind: 'candidate' as const, name })) },\n    { weight: 1, arbitrary: fc.constant({ kind: 'skip' as const }) },\n    { weight: 1, arbitrary: fc.constant({ kind: 'overvote' as const }) }), { minLength: 1, maxLength: 5 }),\n});\nconst elect = fc.array(ballotArb, { minLength: 1, maxLength: 25 });\nconst seatsArb = fc.integer({ min: 1, max: 4 });\nconst quotaArb = fc.constantFrom('droop' as const, 'hare' as const);\nconst num = (s: string) => Number(s);\nconst total = (bs: BallotGroup[]) => bs.reduce((s, b) => s + b.count, 0);\n\ndescribe('STV invariants (property-based)', () => {\n  it('fills exactly `seats` distinct seats from the candidate list', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    const r = tabulateStv(bs as BallotGroup[], C, seats, q);\n    expect(r.winners).toHaveLength(seats);\n    expect(new Set(r.winners).size).toBe(seats);\n    for (const w of r.winners) expect(C).toContain(w);\n  })));\n\n  it('Droop quota is floor(valid/(seats+1))+1 and Hare is valid/seats', () => fc.assert(fc.property(elect, seatsArb, (bs, seats) => {\n    const n = total(bs as BallotGroup[]);\n    expect(tabulateStv(bs as BallotGroup[], C, seats, 'droop').quota).toBe(`${Math.floor(n / (seats + 1)) + 1}.0000`);\n    expect(num(tabulateStv(bs as BallotGroup[], C, seats, 'hare').quota)).toBeCloseTo(n / seats, 4);\n  })));\n\n  it('conservation: hopeful tallies + exhausted + quota kept by earlier winners = total ballots', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    const r = tabulateStv(bs as BallotGroup[], C, seats, q); const n = total(bs as BallotGroup[]); let keptBy = 0;\n    for (const rd of r.rounds) {\n      const vals = Object.values(rd.tallies).map(num);\n      const sum = vals.reduce((a, b) => a + b, 0) + num(rd.exhausted) + keptBy * num(r.quota);\n      // each reported value is rounded to 4 dp: error at most 0.00005 per term\n      expect(Math.abs(sum - n)).toBeLessThanOrEqual(0.00005 * (vals.length + 2 + keptBy) + 1e-9);\n      keptBy += rd.elected.filter(c => Object.prototype.hasOwnProperty.call(rd.tallies, c) && num(rd.tallies[c]) >= num(r.quota) - 1e-9).length;\n    }\n  })));\n\n  it('exhausted value never decreases from one round to the next', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    const r = tabulateStv(bs as BallotGroup[], C, seats, q); let prev = 0;\n    for (const rd of r.rounds) { expect(num(rd.exhausted)).toBeGreaterThanOrEqual(prev - 1e-9); prev = num(rd.exhausted); }\n  })));\n\n  it('a candidate elected on quota reached the quota in that round', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    const r = tabulateStv(bs as BallotGroup[], C, seats, q);\n    for (const rd of r.rounds) if (rd.eliminated.length) expect(rd.elected).toEqual([]);\n    const last = r.rounds.at(-1)!;\n    for (const rd of r.rounds) if (rd !== last) for (const c of rd.elected) expect(num(rd.tallies[c])).toBeGreaterThanOrEqual(num(r.quota) - 1e-9);\n  })));\n\n  it('the eliminated candidate has the lowest tally of that round', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    for (const rd of tabulateStv(bs as BallotGroup[], C, seats, q).rounds) for (const e of rd.eliminated) {\n      const min = Math.min(...Object.values(rd.tallies).map(num)); expect(num(rd.tallies[e])).toBe(min);\n    }\n  })));\n\n  it('a candidate with a Droop quota of first preferences always wins a seat', () => fc.assert(fc.property(elect, seatsArb, (bs, seats) => {\n    const r = tabulateStv(bs as BallotGroup[], C, seats, 'droop');\n    for (const [c, v] of Object.entries(r.rounds[0].tallies)) if (num(v) >= num(r.quota)) expect(r.winners).toContain(c);\n  })));\n\n  it('ballot order never changes the result (byte-identical)', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    expect(JSON.stringify(tabulateStv([...bs].reverse() as BallotGroup[], C, seats, q))).toBe(JSON.stringify(tabulateStv(bs as BallotGroup[], C, seats, q)));\n  })));\n\n  it('splitting a ballot group into two groups gives the same result', () => fc.assert(fc.property(elect.filter(b => b[0].count > 1), seatsArb, quotaArb, (bs, seats, q) => {\n    const [h, ...rest] = bs; const k = Math.floor(h.count / 2);\n    const split = [{ ...h, count: k }, { ...h, count: h.count - k }, ...rest];\n    expect(JSON.stringify(tabulateStv(split as BallotGroup[], C, seats, q))).toBe(JSON.stringify(tabulateStv(bs as BallotGroup[], C, seats, q)));\n  })));\n\n  it('scaling every count by k scales the Hare quota and every tally by k (same winners)', () => fc.assert(fc.property(elect, seatsArb, fc.integer({ min: 2, max: 5 }), (bs, seats, k) => {\n    const a = tabulateStv(bs as BallotGroup[], C, seats, 'hare'), b = tabulateStv(bs.map(x => ({ ...x, count: x.count * k })) as BallotGroup[], C, seats, 'hare');\n    expect(b.winners).toEqual(a.winners); expect(b.rounds.length).toBe(a.rounds.length);\n    b.rounds.forEach((rd, i) => { for (const c of Object.keys(rd.tallies)) expect(num(rd.tallies[c])).toBeCloseTo(num(a.rounds[i].tallies[c]) * k, 3); });\n  })));\n});\n\nconst frac = (s: string) => { const [n, d] = s.split('/'); return new Fraction(BigInt(n), BigInt(d)); };\ndescribe('STV exact surplus conservation (no rounding)', () => {\n  it('every round: Σ hopeful + exhausted + quota × seats already filled = ballots, exactly', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    const r = tabulateStv(bs as BallotGroup[], C, seats, q); const n = Fraction.of(total(bs as BallotGroup[])); const quota = frac(r.quotaExact); let filled = 0;\n    for (const rd of r.rounds) {\n      let sum = frac(rd.exact.exhausted).add(quota.mul(Fraction.of(filled)));\n      for (const v of Object.values(rd.exact.tallies)) sum = sum.add(frac(v));\n      expect(sum.cmp(n)).toBe(0);\n      filled += rd.elected.length;\n    }\n  }), { numRuns: 300 }));\n  it('display values are the exact values rounded to 4 dp', () => fc.assert(fc.property(elect, seatsArb, quotaArb, (bs, seats, q) => {\n    const r = tabulateStv(bs as BallotGroup[], C, seats, q); expect(frac(r.quotaExact).toFixed(4)).toBe(r.quota);\n    for (const rd of r.rounds) { expect(frac(rd.exact.exhausted).toFixed(4)).toBe(rd.exhausted); for (const [c, v] of Object.entries(rd.exact.tallies)) expect(frac(v).toFixed(4)).toBe(rd.tallies[c]); }\n  })));\n  it('surplus transfer: an elected candidate passes on exactly (tally − quota)', () => {\n    // A: 9 first preferences, quota (Droop, 2 seats, 15 ballots) = 6, surplus 3 → B gets 9 × 3/9 = 3 exactly.\n    const r = tabulateStv([{ count: 9, marks: [{ kind: 'candidate', name: 'A' }, { kind: 'candidate', name: 'B' }] }, { count: 2, marks: [{ kind: 'candidate', name: 'B' }] }, { count: 4, marks: [{ kind: 'candidate', name: 'C' }] }], ['A', 'B', 'C'], 2);\n    expect(r.quotaExact).toBe('6/1'); expect(r.rounds[0].elected).toEqual(['A']);\n    expect(r.rounds[1].exact.tallies).toEqual({ B: '5/1', C: '4/1' });\n  });\n});\n\ndescribe('STV deterministic ties', () => {\n  it('a tie for last (after A is elected on quota) eliminates the candidate listed later, every time', () => {\n    const bs: BallotGroup[] = [{ count: 5, marks: [{ kind: 'candidate', name: 'A' }] }, { count: 2, marks: [{ kind: 'candidate', name: 'B' }] }, { count: 2, marks: [{ kind: 'candidate', name: 'C' }] }, { count: 3, marks: [{ kind: 'candidate', name: 'D' }] }];\n    for (let i = 0; i <"+" 5; i++) expect(tabulateStv(bs, ['A', 'B', 'C', 'D'], 2).rounds[1].eliminated).toEqual(['C']);\n    expect(tabulateStv(bs, ['A', 'C', 'B', 'D'], 2).rounds[1].eliminated).toEqual(['B']);\n  });\n  it('with all-equal tallies the eliminated candidate is always the last-listed hopeful', () => fc.assert(fc.property(fc.integer({ min: 1, max: 20 }), fc.shuffledSubarray(C, { minLength: 3, maxLength: 5 }), (k, order) => {\n    const bs = order.map(name => ({ count: k, marks: [{ kind: 'candidate' as const, name }] }));\n    const r = tabulateStv(bs, order, 1); if (r.rounds[0].eliminated.length) expect(r.rounds[0].eliminated).toEqual([order.at(-1)]);\n  })));\n});\n"},"test/nyc.parity.test.ts":{"tests":[{"id":"34","name":"NYC 2021 Democratic mayoral primary — certified parity from official CVR T26 all 8 rounds match the certified recap exactly (tallies, inactive, eliminations)"},{"id":"35","name":"NYC 2021 Democratic mayoral primary — certified parity from official CVR batch elimination is required: one-at-a-time gives more rounds, same final"}],"source":"import { describe, it, expect } from 'vitest';\nimport { tabulateIrv } from '../src/index.js';\nimport { NYC_2021_DEM_MAYOR as E } from '../src/elections/nyc-2021-dem-mayor.js';\ndescribe('NYC 2021 Democratic mayoral primary — certified parity from official CVR', () => {\n  const r = tabulateIrv(E.load(), E.candidates, E.rules);\n  const inact = (i: number) => Object.values(r.rounds[i].inactive).reduce((a, b) => a + b, 0) - Object.values(r.rounds[0].inactive).reduce((a, b) => a + b, 0);\n  it('T26 all 8 rounds match the certified recap exactly (tallies, inactive, eliminations)', () => {\n    expect(r.rounds.length).toBe(8);\n    E.certified.rounds.forEach((cr, i) => {\n      expect(r.rounds[i].tallies).toEqual(cr.tallies);\n      expect(inact(i)).toBe(cr.inactive);\n      expect([...r.rounds[i].eliminated].sort()).toEqual([...cr.eliminated].sort());\n    });\n    expect(r.winner).toBe('Eric L. Adams');\n  });\n  it('batch elimination is required: one-at-a-time gives more rounds, same final', () => {\n    const s = tabulateIrv(E.load(), E.candidates, { ...E.rules, batch: false });\n    expect(s.rounds.length).toBeGreaterThan(8); expect(s.rounds.at(-1)!.tallies).toEqual(E.certified.rounds[7].tallies);\n  });\n});\n"},"test/properties.test.ts":{"tests":[{"id":"36","name":"engine invariants (property-based) conservation and monotone inactive in every round"},{"id":"37","name":"engine invariants (property-based) ballot order never changes the result"},{"id":"38","name":"engine invariants (property-based) scaling all counts by k scales every tally by k (winner unchanged)"},{"id":"39","name":"engine invariants (property-based) winner holds a majority of continuing ballots or is last standing / two-way leader"},{"id":"40","name":"engine invariants (property-based) determinism: same input, byte-identical output"}],"source":"import { describe, it, expect } from 'vitest';\nimport fc from 'fast-check';\nimport { tabulateIrv, BallotGroup } from '../src/index.js';\nconst C = ['A', 'B', 'C', 'D'];\nconst ballotArb = fc.record({ count: fc.integer({ min: 1, max: 50 }), marks: fc.array(fc.oneof(\n  fc.constantFrom(...C).map(name => ({ kind: 'candidate' as const, name })), fc.constant({ kind: 'skip' as const }), fc.constant({ kind: 'overvote' as const })), { minLength: 1, maxLength: 5 }) });\nconst rulesArb = fc.record({ overvote: fc.constantFrom('exhaust', 'skip' as const), skips: fc.constantFrom('continue', 'two-exhaust' as const), batch: fc.boolean(), tiebreak: fc.constantFrom('previous-round', 'lot' as const) });\nconst elect = fc.array(ballotArb, { minLength: 1, maxLength: 30 });\ndescribe('engine invariants (property-based)', () => {\n  it('conservation and monotone inactive in every round', () => fc.assert(fc.property(elect, rulesArb, (bs, rules) => {\n    const r = tabulateIrv(bs as BallotGroup[], C, rules); const total = bs.reduce((s, b) => s + b.count, 0); let prev = 0;\n    for (const rd of r.rounds) { const ina = Object.values(rd.inactive).reduce((a, b) => a + b, 0); expect(rd.continuing + ina).toBe(total); expect(ina).toBeGreaterThanOrEqual(prev); prev = ina; }\n  })));\n  it('ballot order never changes the result', () => fc.assert(fc.property(elect, rulesArb, (bs, rules) => {\n    const a = tabulateIrv(bs as BallotGroup[], C, rules), b = tabulateIrv([...bs].reverse() as BallotGroup[], C, rules);\n    expect(JSON.stringify(b)).toBe(JSON.stringify(a));\n  })));\n  it('scaling all counts by k scales every tally by k (winner unchanged)', () => fc.assert(fc.property(elect, rulesArb, fc.integer({ min: 2, max: 7 }), (bs, rules, k) => {\n    const a = tabulateIrv(bs as BallotGroup[], C, rules), b = tabulateIrv(bs.map(x => ({ ...x, count: x.count * k })) as BallotGroup[], C, rules);\n    expect(b.winner).toBe(a.winner); expect(b.rounds.length).toBe(a.rounds.length);\n    b.rounds.forEach((rd, i) => { for (const c of Object.keys(rd.tallies)) expect(rd.tallies[c]).toBe(a.rounds[i].tallies[c] * k); });\n  })));\n  it('winner holds a majority of continuing ballots or is last standing / two-way leader', () => fc.assert(fc.property(elect, rulesArb, (bs, rules) => {\n    const r = tabulateIrv(bs as BallotGroup[], C, rules); const last = r.rounds.at(-1)!; const n = Object.keys(last.tallies).length;\n    expect(last.tallies[r.winner] >= last.threshold || n <"+"= 2).toBe(true);\n  })));\n  it('determinism: same input, byte-identical output', () => fc.assert(fc.property(elect, rulesArb, (bs, rules) => {\n    expect(JSON.stringify(tabulateIrv(bs as BallotGroup[], C, rules))).toBe(JSON.stringify(tabulateIrv(bs as BallotGroup[], C, rules)));\n  })));\n});\n"},"test/tabulate-upload.test.ts":{"tests":[{"id":"41","name":"POST /api/tabulate CSV and JSON ballots counts a CSV with rank columns and a count column"},{"id":"42","name":"POST /api/tabulate CSV and JSON ballots counts headerless CSV and 1st/2nd Choice headers, including skips and overvotes"},{"id":"43","name":"POST /api/tabulate CSV and JSON ballots auto-detects CSV when the body is not JSON"},{"id":"44","name":"POST /api/tabulate CSV and JSON ballots accepts a JSON array of ballots and { count, ranks } objects"},{"id":"45","name":"POST /api/tabulate CSV and JSON ballots accepts a JSON csv field and still applies rules"},{"id":"46","name":"POST /api/tabulate CSV and JSON ballots JSON array with seats uses STV"},{"id":"47","name":"POST /api/tabulate CSV and JSON ballots 400 on malformed JSON, malformed CSV, and the wrong ballots type"},{"id":"48","name":"POST /api/tabulate CSV and JSON ballots 422 when the upload is readable but cannot be counted, with row and column"},{"id":"49","name":"POST /api/tabulate CSV and JSON ballots BUG-001: headerless single-choice ballots (\"3,A\") count as ranking lines"},{"id":"50","name":"POST /api/tabulate CSV and JSON ballots reads headerless count,A>B as a ranking instead of two candidate names"},{"id":"51","name":"POST /api/tabulate CSV and JSON ballots rejects a \">\" ranking mixed into rank columns, and a numeric headerless first column"},{"id":"52","name":"POST /api/tabulate CSV and JSON ballots 413 still applies to a CSV body over 4 MB"},{"id":"53","name":"POST /api/tabulate CSV and JSON ballots route accepts a CSV content type and a multipart file upload"}],"source":"import { describe, it, expect } from 'vitest';\nimport { handleTabulate } from '../src/api.js';\nimport { POST } from '../app/api/tabulate/route.js';\n\nconst T02 = 'count,rank1,rank2\\n8,A,D\\n6,B,C\\n4,C,B\\n3,D,C\\n';\n\ndescribe('POST /api/tabulate CSV and JSON ballots', () => {\n  it('counts a CSV with rank columns and a count column', () => {\n    const r = handleTabulate('POST', T02, { contentType: 'text/csv' }) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.method).toBe('irv');\n    expect(r.body.winner).toBe('C');\n    expect(r.body.rounds[0].tallies).toEqual({ A: 8, B: 6, C: 4, D: 3 });\n    expect(r.body.totalBallots).toBe(21);\n  });\n\n  it('counts headerless CSV and 1st/2nd Choice headers, including skips and overvotes', () => {\n    const headerless = handleTabulate('POST', 'A,D\\nA,D\\nB\\n', { contentType: 'text/csv' }) as any;\n    expect(headerless.status).toBe(200);\n    expect(headerless.body.rounds[0].tallies).toEqual({ A: 2, D: 0, B: 1 });\n    const labeled = '1st Choice,2nd Choice\\n\"Smith, Jr.\",Lee\\novervote,Lee\\n_,Lee\\n';\n    const r = handleTabulate('POST', labeled, { contentType: 'text/csv; charset=utf-8' }) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.candidates).toEqual(['Smith, Jr.', 'Lee']);\n    expect(r.body.rounds[0].tallies).toEqual({ 'Smith, Jr.': 1, Lee: 1 });\n    expect(r.body.rounds[0].inactive.overvote).toBe(1);\n  });\n\n  it('auto-detects CSV when the body is not JSON', () => {\n    const r = handleTabulate('POST', T02) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.winner).toBe('C');\n  });\n\n  it('accepts a JSON array of ballots and { count, ranks } objects', () => {\n    const asArrays = handleTabulate('POST', JSON.stringify([\n      ['A', 'D'], ['A', 'D'], ['A', 'D'], ['A', 'D'], ['A', 'D'], ['A', 'D'], ['A', 'D'], ['A', 'D'],\n      ['B', 'C'], ['B', 'C'], ['B', 'C'], ['B', 'C'], ['B', 'C'], ['B', 'C'],\n      ['C', 'B'], ['C', 'B'], ['C', 'B'], ['C', 'B'],\n      ['D', 'C'], ['D', 'C'], ['D', 'C'],\n    ])) as any;\n    expect(asArrays.status).toBe(200);\n    expect(asArrays.body.winner).toBe('C');\n    const grouped = handleTabulate('POST', JSON.stringify({\n      ballots: [\n        { count: 8, ranks: ['A', 'D'] },\n        { count: 6, ranking: 'B>C' },\n        { count: 4, ranks: ['C', 'B'] },\n        { count: 3, ranks: ['D', 'C'] },\n      ],\n    })) as any;\n    expect(grouped.status).toBe(200);\n    expect(grouped.body.rounds[2].tallies).toEqual({ A: 8, C: 13 });\n    expect(grouped.body.winner).toBe('C');\n  });\n\n  it('accepts a JSON csv field and still applies rules', () => {\n    const r = handleTabulate('POST', JSON.stringify({\n      csv: 'count,rank1,rank2\\n5,A\\n3,B,C\\n3,C,B\\n',\n      rules: { lotOrder: ['A', 'B', 'C'] },\n    })) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.rounds[0].eliminated).toEqual(['C']);\n    expect(r.body.winner).toBe('B');\n  });\n\n  it('JSON array with seats uses STV', () => {\n    const r = handleTabulate('POST', JSON.stringify({\n      ballots: [{ count: 3, ranks: ['A', 'B'] }, { count: 3, ranks: ['A', 'C'] }, { count: 2, ranks: ['B'] }, { count: 1, ranks: ['C'] }, { count: 4, ranks: ['D'] }],\n      seats: 2,\n    })) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.method).toBe('stv');\n    expect([...r.body.winners].sort()).toEqual(['A', 'D']);\n  });\n\n  it('400 on malformed JSON, malformed CSV, and the wrong ballots type', () => {\n    expect(handleTabulate('POST', '{x', { contentType: 'application/json' }).body).toEqual({ error: { code: 'INVALID_JSON', message: 'Invalid JSON body', details: null } });\n    expect(handleTabulate('POST', 'rank1,rank2\\n\"Alice,Bob\\n', { contentType: 'text/csv' }).status).toBe(400);\n    expect(handleTabulate('POST', 'rank1\\n\"Alice,Bob\\n', { contentType: 'text/csv' }).body).toEqual({\n      error: { code: 'UNTERMINATED_QUOTE', message: 'Line 2: unterminated quoted field', details: { row: 2, column: 1 } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: 12 })).status).toBe(400);\n    expect(handleTabulate('POST', JSON.stringify({ ballots: 12 })).body).toEqual({ error: { code: 'INVALID_BALLOTS', message: 'Field \"ballots\" must be a ranking string or an array of ballots', details: null } });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: '1,A', rules: { foo: 1 } })).body).toEqual({ error: { code: 'UNKNOWN_RULE', message: 'Unknown rule key(s): foo', details: { keys: ['foo'] } } });\n  });\n\n  it('422 when the upload is readable but cannot be counted, with row and column', () => {\n    expect(handleTabulate('POST', 'rank1,rank2\\n', { contentType: 'text/csv' })).toMatchObject({ status: 422, body: { error: { code: 'NO_BALLOTS', message: 'No valid ballots to count', details: null } } });\n    expect(handleTabulate('POST', 'count,rank1\\n0,A\\n', { contentType: 'text/csv' }).body).toEqual({\n      error: { code: 'INVALID_COUNT', message: 'Row 2, column 1: count must be a positive integer', details: { row: 2, column: 1 } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: [] }))).toMatchObject({ status: 422, body: { error: { code: 'NO_BALLOTS', message: 'No valid ballots to count' } } });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: [{ count: -2, ranks: ['A'] }] })).body).toEqual({\n      error: { code: 'INVALID_COUNT', message: 'Ballot 1: count must be a positive integer', details: { row: 1 } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: [{ ranks: ['Zed'] }], candidates: ['A', 'B'] })).body).toEqual({\n      error: { code: 'UNKNOWN_CANDIDATE', message: 'Row 1, column 1: unknown candidate \"Zed\"', details: { row: 1, column: 1, candidate: 'Zed' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ csv: 'rank1,rank2\\nA,Zed\\n', candidates: ['A'] })).body).toEqual({\n      error: { code: 'UNKNOWN_CANDIDATE', message: 'Row 2, column 2: unknown candidate \"Zed\"', details: { row: 2, column: 2, candidate: 'Zed' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: '1,A>Zed', candidates: ['A'] })).status).toBe(422);\n    expect(handleTabulate('POST', JSON.stringify({ ballots: '1,A>Zed', candidates: ['A'] })).body).toEqual({\n      error: { code: 'UNKNOWN_CANDIDATE', message: 'Line 1: unknown candidate \"Zed\"', details: { row: 1, column: 2, candidate: 'Zed' } },\n    });\n  });\n\n  // BUG-001 (BUGS.md) regression guard.\n  it('BUG-001: headerless single-choice ballots (\"3,A\") count as ranking lines', () => {\n    const r = handleTabulate('POST', '3,A\\n2,B\\n', { contentType: 'text/csv' }) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.candidates).toEqual(['A', 'B']);\n    expect(r.body.rounds[0].tallies).toEqual({ A: 3, B: 2 });\n    expect(r.body.winner).toBe('A');\n    const mixed = handleTabulate('POST', '4,A\\n3,B>A\\n2,C>B\\n', { contentType: 'text/csv' }) as any;\n    expect(mixed.status).toBe(200);\n    expect(mixed.body.rounds[0].tallies).toEqual({ A: 4, B: 3, C: 2 });\n    const zero = handleTabulate('POST', '0,A\\n2,B\\n', { contentType: 'text/csv' }) as any;\n    expect(zero.status).toBe(400); expect(zero.body.error.code).toBe('INVALID_COUNT');\n    const numeric = handleTabulate('POST', '1,2\\n3,4\\n', { contentType: 'text/csv' }) as any;\n    expect(numeric.body.error.code).toBe('CSV_FORMAT_AMBIGUOUS');\n  });\n\n  it('reads headerless count,A>B as a ranking instead of two candidate names', () => {\n    const r = handleTabulate('POST', '5,A>B', { contentType: 'text/csv' }) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.candidates).toEqual(['A', 'B']);\n    expect(r.body.totalBallots).toBe(5);\n    expect(r.body.rounds[0].tallies).toEqual({ A: 5, B: 0 });\n    expect(r.body.winner).toBe('A');\n    const several = handleTabulate('POST', '5,A>B\\n3,B>A\\n', { contentType: 'text/csv' }) as any;\n    expect(several.status).toBe(200);\n    expect(several.body.totalBallots).toBe(8);\n    expect(several.body.rounds[0].tallies).toEqual({ A: 5, B: 3 });\n    const viaJson = handleTabulate('POST', JSON.stringify({ csv: '5,A>B' })) as any;\n    expect(viaJson.status).toBe(200);\n    expect(viaJson.body.candidates).toEqual(['A', 'B']);\n    expect(viaJson.body.totalBallots).toBe(5);\n  });\n\n  it('rejects a \">\" ranking mixed into rank columns, and a numeric headerless first column', () => {\n    const mixed = handleTabulate('POST', '5,A>B,C\\n', { contentType: 'text/csv' });\n    expect(mixed.status).toBe(422);\n    expect(mixed.body).toEqual({\n      error: {\n        code: 'CSV_FORMAT_AMBIGUOUS',\n        message: 'Row 1, column 2: \">\" joins ranks inside one cell, so this is not one candidate per column. Use ranking lines such as \"5,A>B\", or one candidate per column: count,rank1,rank2,...',\n        details: { row: 1, column: 2 },\n      },\n    });\n    const headed = handleTabulate('POST', 'count,rank1\\n5,A>B\\n', { contentType: 'text/csv' });\n    expect(headed.status).toBe(422);\n    expect(headed.body).toMatchObject({ error: { code: 'CSV_FORMAT_AMBIGUOUS', details: { row: 2, column: 2 } } });\n    const numeric = handleTabulate('POST', '5,A,B\\n', { contentType: 'text/csv' });\n    expect(numeric.status).toBe(422);\n    expect(numeric.body).toEqual({\n      error: {\n        code: 'CSV_FORMAT_AMBIGUOUS',\n        message: 'Row 1, column 1: candidate name \"5\" is purely numeric. With no header, a leading count belongs in count,rank1,rank2,...',\n        details: { row: 1, column: 1, candidate: '5' },\n      },\n    });\n    const named = handleTabulate('POST', 'rank1,rank2\\n5,Alice\\n', { contentType: 'text/csv' }) as any;\n    expect(named.status).toBe(200);\n    expect(named.body.candidates).toEqual(['5', 'Alice']);\n  });\n\n  it('413 still applies to a CSV body over 4 MB', () => {\n    expect(handleTabulate('POST', 'a,b\\n' + 'x'.repeat(4 * 1024 * 1024), { contentType: 'text/csv' }).status).toBe(413);\n  });\n\n  it('route accepts a CSV content type and a multipart file upload', async () => {\n    const csv = await POST(new Request('http://localhost/api/tabulate', {\n      method: 'POST', headers: { 'content-type': 'text/csv' }, body: T02,\n    }));\n    expect(csv.status).toBe(200);\n    expect((await csv.json()).winner).toBe('C');\n\n    const fd = new FormData();\n    fd.set('file', new File([T02], 'ballots.csv', { type: 'text/csv' }));\n    const uploaded = await POST(new Request('http://localhost/api/tabulate', { method: 'POST', body: fd }));\n    expect(uploaded.status).toBe(200);\n    expect((await uploaded.json()).winner).toBe('C');\n\n    const missing = await POST(new Request('http://localhost/api/tabulate', { method: 'POST', body: new FormData() }));\n    expect(missing.status).toBe(400);\n    expect(await missing.json()).toEqual({ error: { code: 'MISSING_FILE', message: 'Expected a file field named \"file\" or \"ballots\"', details: { fields: ['file', 'ballots'] } } });\n  });\n});\n"},"test/report.api.test.ts":{"tests":[{"id":"54","name":"GET and POST /api/report returns a stable report for a bundled election, with a content hash of the other fields"},{"id":"55","name":"GET and POST /api/report POST { election } matches GET, including aliases"},{"id":"56","name":"GET and POST /api/report hashes an uploaded count, and a different tie-break changes the hash"},{"id":"57","name":"GET and POST /api/report POST CSV and STV uploads return a hashed report"},{"id":"58","name":"GET and POST /api/report rejects missing, unknown, and ambiguous election requests"},{"id":"59","name":"GET and POST /api/report 413 above 10 MB and the route serves canonical JSON"}],"source":"import { createHash } from 'node:crypto';\nimport { describe, it, expect } from 'vitest';\nimport { canonicalJson } from '../src/report.js';\nimport { contentHash, handleReport, ShareableReport } from '../src/report-api.js';\nimport { GET, POST } from '../app/api/report/route.js';\nimport { MAINE_2018_CD2 } from '../src/elections/maine-2018-cd2.js';\n\nconst asReport = (body: unknown) => body as ShareableReport;\n\ndescribe('GET and POST /api/report', () => {\n  it('returns a stable report for a bundled election, with a content hash of the other fields', () => {\n    const a = handleReport('GET', { election: 'maine-2018-cd2' });\n    const b = handleReport('GET', { election: 'maine-2018-cd2' });\n    expect(a.status).toBe(200);\n    expect(a.body).toEqual(b.body);\n    const report = asReport(a.body);\n    expect(report.election).toBe('maine-2018-cd2');\n    expect(report.winner).toBe('DEM Golden, Jared F.');\n    expect(report.certifiedWinner).toBe('DEM Golden, Jared F.');\n    expect(report.ballotCount).toBe(MAINE_2018_CD2.certified.totalBallots);\n    expect(report.method).toBe('IRV');\n    expect(report.seats).toBe(1);\n    expect(report.rules).toMatchObject({ overvote: 'exhaust', skips: 'two-exhaust', batch: true, tiebreak: 'lot' });\n    expect(report.source).toMatch(/^https:\\/\\/www\\.maine\\.gov\\//);\n    expect(report.rounds).toHaveLength(2);\n    expect(report.rounds[1]).toMatchObject({ tallies: MAINE_2018_CD2.certified.final });\n    const { contentHash: hash, ...rest } = report;\n    expect(hash).toBe(contentHash(rest));\n    expect(hash).toBe(`sha256:${createHash('sha256').update(canonicalJson(rest)).digest('hex')}`);\n    expect(hash).toMatch(/^sha256:[a-f0-9]{64}$/);\n  });\n\n  it('POST { election } matches GET, including aliases', () => {\n    const viaGet = handleReport('GET', { election: 'alaska-2022-special' });\n    const viaPost = handleReport('POST', { rawBody: JSON.stringify({ election: 'alaska-2022' }) });\n    expect(viaGet.status).toBe(200);\n    expect(viaPost.body).toEqual(viaGet.body);\n    const report = asReport(viaGet.body);\n    expect(report.election).toBe('alaska-2022');\n    expect(report.winner).toBe('Peltola, Mary S.');\n    expect(report.rules).toMatchObject({ duplicates: 'skip', skips: 'two-exhaust' });\n    const edges = (report.rounds[1] as { transfers: { to: string; count: number }[] }).transfers;\n    expect(edges).toEqual([\n      { from: 'Begich, Nick', to: 'Palin, Sarah', count: 27053 },\n      { from: 'Begich, Nick', to: 'Peltola, Mary S.', count: 15467 },\n      { from: 'Begich, Nick', to: 'exhausted', count: 11290 },\n    ]);\n  });\n\n  it('hashes an uploaded count, and a different tie-break changes the hash', () => {\n    const ballots = '5,A\\n3,B>C\\n3,C>B';\n    const first = handleReport('POST', { rawBody: JSON.stringify({ ballots, rules: { lotOrder: ['A', 'B', 'C'] } }) });\n    const again = handleReport('POST', { rawBody: JSON.stringify({ ballots, rules: { lotOrder: ['A', 'B', 'C'] } }) });\n    const flipped = handleReport('POST', { rawBody: JSON.stringify({ ballots, rules: { lotOrder: ['A', 'C', 'B'] } }) });\n    expect(first.status).toBe(200);\n    expect(again.body).toEqual(first.body);\n    const report = asReport(first.body);\n    expect(report.election).toBeNull();\n    expect(report.name).toBe('Uploaded ballots');\n    expect(report.winner).toBe('B');\n    expect(asReport(flipped.body).winner).toBe('C');\n    expect(asReport(flipped.body).contentHash).not.toBe(report.contentHash);\n    const incoming = (report.rounds[1] as { transfers: { from: string; to: string; count: number }[] }).transfers;\n    expect(incoming).toEqual([{ from: 'C', to: 'B', count: 3 }]);\n  });\n\n  it('POST CSV and STV uploads return a hashed report', () => {\n    const csv = handleReport('POST', { rawBody: 'count,rank1,rank2\\n8,A,D\\n6,B,C\\n4,C,B\\n3,D,C\\n', contentType: 'text/csv' });\n    expect(csv.status).toBe(200);\n    expect(asReport(csv.body).winner).toBe('C');\n    expect(asReport(csv.body).contentHash).toMatch(/^sha256:[a-f0-9]{64}$/);\n    const stv = handleReport('POST', { rawBody: JSON.stringify({ ballots: '3,A>B\\n3,A>C\\n2,B\\n1,C\\n4,D', seats: 2 }) });\n    expect(stv.status).toBe(200);\n    const body = asReport(stv.body);\n    expect(body.method).toBe('STV');\n    expect(body.seats).toBe(2);\n    expect(body.quota).toBe('5.0000');\n    expect(body.winner).toBeNull();\n    expect([...body.winners].sort()).toEqual(['A', 'D']);\n  });\n\n  it('rejects missing, unknown, and ambiguous election requests', () => {\n    expect(handleReport('GET', {}).status).toBe(400);\n    expect(handleReport('GET', {}).body).toEqual({ error: { code: 'MISSING_ELECTION', message: 'Query parameter \"election\" is required', details: { field: 'election' } } });\n    expect(handleReport('GET', { election: 'nope' }).status).toBe(404);\n    expect(handleReport('POST', { rawBody: JSON.stringify({ election: 'nope' }) }).body).toEqual({ error: { code: 'UNKNOWN_ELECTION', message: 'Unknown election \"nope\"', details: { id: 'nope' } } });\n    expect(handleReport('POST', { rawBody: '{}' }).body).toEqual({ error: { code: 'MISSING_FIELD', message: 'Field \"election\" or \"ballots\" is required', details: null } });\n    expect(handleReport('POST', { rawBody: '{x' }).body).toEqual({ error: { code: 'INVALID_JSON', message: 'Invalid JSON body', details: null } });\n    expect(handleReport('POST', { rawBody: JSON.stringify({ election: 'maine-2018-cd2', ballots: '1,A' }) }).status).toBe(400);\n    expect(handleReport('PUT', {}).status).toBe(405);\n    expect(handleReport('PUT', {}).headers).toEqual({ Allow: 'GET, POST' });\n  });\n\n  it('413 above 10 MB and the route serves canonical JSON', async () => {\n    expect(handleReport('POST', { rawBody: 'x'.repeat(4 * 1024 * 1024 + 1) }).status).toBe(413);\n    const res = await GET(new Request('http://localhost/api/report?election=nyc-2021'));\n    expect(res.status).toBe(200);\n    const text = await res.text();\n    const parsed = JSON.parse(text) as ShareableReport;\n    expect(text).toBe(canonicalJson(parsed));\n    expect(parsed.winner).toBe('Eric L. Adams');\n    expect(parsed.ballotCount).toBe(947932);\n    expect(parsed.rounds).toHaveLength(8);\n    const posted = await POST(new Request('http://localhost/api/report', {\n      method: 'POST',\n      headers: { 'content-type': 'application/json' },\n      body: JSON.stringify({ election: 'nyc-2021' }),\n    }));\n    expect(await posted.text()).toBe(text);\n  });\n});\n"},"test/presets.api.test.ts":{"tests":[{"id":"60","name":"named rule presets documents defaults and the three preset ids"},{"id":"61","name":"named rule presets maine-2018 matches the certified final; omitted rules do not"},{"id":"62","name":"named rule presets alaska-2022 preset matches the certified two-round count"},{"id":"63","name":"named rule presets rejects an unknown preset id"}],"source":"import { describe, it, expect } from 'vitest';\nimport { handleTabulate } from '../src/api.js';\nimport { handleOptions } from '../src/options.js';\nimport { MAINE_2018_CD2 as ME } from '../src/elections/maine-2018-cd2.js';\nimport { ALASKA_2022_SPECIAL as AK } from '../src/elections/alaska-2022-special.js';\nimport { NYC_2021_DEM_MAYOR as NYC } from '../src/elections/nyc-2021-dem-mayor.js';\nimport { BallotGroup, Mark } from '../src/types.js';\nimport { RULE_PRESETS } from '../src/presets.js';\n\nfunction payload(groups: BallotGroup[], rules: unknown, candidates: string[]) {\n  const token = (m: Mark) => (m.kind === 'candidate' ? m.name : m.kind === 'overvote' ? 'overvote' : 'undervote');\n  return JSON.stringify({\n    ballots: groups.map(g => ({ count: g.count, ranks: g.marks.map(token) })),\n    candidates,\n    rules,\n  });\n}\n\ndescribe('named rule presets', () => {\n  it('documents defaults and the three preset ids', () => {\n    const body = handleOptions('GET').body as any;\n    expect(body.defaults.rules).toEqual({ overvote: 'exhaust', skips: 'continue', duplicates: 'ignore', batch: false, tiebreak: 'previous-round' });\n    expect(body.defaults.description).toContain('142,558');\n    expect(body.defaults.description).toContain('139,113');\n    expect(body.defaults.description).toContain('not the certified');\n    expect(body.presets.ids).toEqual(['maine-2018', 'alaska-2022', 'nyc-2021']);\n    expect(body.presets.sets['maine-2018']).toEqual(ME.rules);\n    expect(body.presets.sets['alaska-2022']).toEqual(AK.rules);\n    expect(body.presets.sets['nyc-2021']).toEqual(NYC.rules);\n    expect(RULE_PRESETS['nyc-2021']).toEqual(NYC.rules);\n  });\n\n  it('maine-2018 matches the certified final; omitted rules do not', () => {\n    const groups = ME.load();\n    const certified = handleTabulate('POST', payload(groups, 'maine-2018', ME.candidates)) as any;\n    expect(certified.status).toBe(200);\n    expect(certified.body.rounds).toHaveLength(2);\n    expect(certified.body.rounds[1].tallies).toEqual({ 'DEM Golden, Jared F.': 142440, 'REP Poliquin, Bruce': 138931 });\n    expect(certified.body.winner).toBe('DEM Golden, Jared F.');\n    expect(certified.body.rules).toMatchObject({ skips: 'two-exhaust', batch: true, tiebreak: 'lot' });\n\n    const defaults = handleTabulate('POST', payload(groups, undefined, ME.candidates)) as any;\n    expect(defaults.status).toBe(200);\n    expect(defaults.body.rounds.at(-1).tallies).toEqual({ 'DEM Golden, Jared F.': 142558, 'REP Poliquin, Bruce': 139113 });\n  });\n\n  it('alaska-2022 preset matches the certified two-round count', () => {\n    const r = handleTabulate('POST', payload(AK.load(), 'alaska-2022', AK.candidates)) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.rounds).toHaveLength(2);\n    expect(r.body.rounds[1].tallies).toEqual({ 'Palin, Sarah': 86026, 'Peltola, Mary S.': 91266 });\n    expect(r.body.rules.duplicates).toBe('skip');\n  });\n\n  it('rejects an unknown preset id', () => {\n    const r = handleTabulate('POST', JSON.stringify({ ballots: '1,A', rules: 'not-a-preset' }));\n    expect(r.status).toBe(400);\n    expect(r.body).toEqual({ error: { code: 'UNKNOWN_PRESET', message: 'Unknown rules preset \"not-a-preset\". Expected maine-2018, alaska-2022, nyc-2021', details: null } });\n  });\n});\n"},"test/options.api.test.ts":{"tests":[{"id":"64","name":"tie-break and STV options GET /api/options lists tie-break and multi-seat choices"},{"id":"65","name":"tie-break and STV options 405 on POST /api/options"},{"id":"66","name":"tie-break and STV options lot order is accepted and changes who is eliminated"},{"id":"67","name":"tie-break and STV options 422 on invalid tie-break, quota, seats type, and lot order"},{"id":"68","name":"tie-break and STV options keeps integer seats that are out of range on the existing error"},{"id":"69","name":"tie-break and STV options Hare quota is accepted for multi-seat STV and changes the quota"},{"id":"70","name":"tie-break and STV options report uploads use the same option checks"},{"id":"71","name":"tie-break and STV options route serves the options document"}],"source":"import { describe, it, expect } from 'vitest';\nimport { handleTabulate } from '../src/api.js';\nimport { handleReport } from '../src/report-api.js';\nimport { handleOptions } from '../src/options.js';\nimport { GET } from '../app/api/options/route.js';\n\nconst food = '4,Oranges\\n2,Pears>Oranges\\n8,Chocolate>Strawberries\\n4,Chocolate>Hamburgers\\n1,Strawberries\\n1,Hamburgers';\n\ndescribe('tie-break and STV options', () => {\n  it('GET /api/options lists tie-break and multi-seat choices', () => {\n    const r = handleOptions('GET') as any;\n    expect(r.status).toBe(200);\n    expect(r.body.tiebreak.default).toBe('previous-round');\n    expect(r.body.tiebreak.options.map((o: { id: string }) => o.id)).toEqual(['previous-round', 'lot']);\n    expect(r.body.tiebreak.lotOrder.field).toBe('rules.lotOrder');\n    expect(r.body.stv.seats.field).toBe('seats');\n    expect(r.body.stv.seats.minimum).toBe(1);\n    expect(r.body.stv.quota.default).toBe('droop');\n    expect(r.body.stv.quota.options.map((o: { id: string }) => o.id)).toEqual(['droop', 'hare']);\n    expect(r.body.stv.quota.options[0].description).toContain('floor(ballots / (seats + 1)) + 1');\n    expect(r.body.rules.overvote.options).toEqual(['exhaust', 'skip']);\n    expect(r.body.rules.skips.options).toEqual(['continue', 'two-exhaust']);\n    expect(r.body.rules.duplicates.options).toEqual(['ignore', 'skip']);\n    expect(r.body.rules.batch.default).toBe(false);\n    for (const opt of r.body.tiebreak.options) expect(opt.description.length).toBeGreaterThan(20);\n  });\n\n  it('405 on POST /api/options', () => {\n    const r = handleOptions('POST');\n    expect(r.status).toBe(405);\n    expect(r.headers).toEqual({ Allow: 'GET' });\n  });\n\n  it('lot order is accepted and changes who is eliminated', () => {\n    const body = JSON.stringify({ ballots: '5,A\\n3,B>C\\n3,C>B', rules: { tiebreak: 'lot', lotOrder: ['A', 'C', 'B'] } });\n    const r = handleTabulate('POST', body) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.rules.tiebreak).toBe('lot');\n    expect(r.body.rounds[0].eliminated).toEqual(['B']);\n    expect(r.body.winner).toBe('C');\n  });\n\n  it('422 on invalid tie-break, quota, seats type, and lot order', () => {\n    const ballots = '1,A\\n1,B';\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { tiebreak: 'coin' } }))).toMatchObject({\n      status: 422, body: { error: { code: 'INVALID_TIEBREAK', message: 'rules.tiebreak must be one of: previous-round, lot' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { overvote: 'maybe' } })).status).toBe(422);\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { skips: 'never' } })).status).toBe(422);\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { duplicates: 'drop' } })).status).toBe(422);\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { batch: 'yes' } }))).toMatchObject({\n      status: 422, body: { error: { code: 'INVALID_BATCH', message: 'rules.batch must be a boolean' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { lotOrder: 'A,B' } }))).toMatchObject({\n      status: 422, body: { error: { code: 'INVALID_LOT_ORDER', message: 'rules.lotOrder must be an array of candidate names' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { lotOrder: ['A'] } }))).toMatchObject({\n      status: 422, body: { error: { code: 'INVALID_LOT_ORDER', message: 'rules.lotOrder is missing candidate \"B\"' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { lotOrder: ['A', 'A', 'B'] } }))).toMatchObject({\n      status: 422, body: { error: { code: 'INVALID_LOT_ORDER', message: 'rules.lotOrder contains a duplicate \"A\"' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots, seats: 1.5 }))).toMatchObject({\n      status: 422, body: { error: { code: 'INVALID_SEATS', message: 'seats must be an integer from 1 to the number of candidates' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots, seats: '2' })).status).toBe(422);\n    expect(handleTabulate('POST', JSON.stringify({ ballots, quota: 'meek' }))).toMatchObject({\n      status: 422, body: { error: { code: 'INVALID_QUOTA', message: 'quota must be one of: droop, hare' } },\n    });\n    expect(handleTabulate('POST', JSON.stringify({ ballots, rules: { foo: 1 } })).status).toBe(400);\n  });\n\n  it('keeps integer seats that are out of range on the existing error', () => {\n    const r = handleTabulate('POST', JSON.stringify({ ballots: '1,A\\n1,B', seats: 3 }));\n    expect(r.status).toBe(400);\n    expect(r.body).toEqual({ error: { code: 'SEATS_OUT_OF_RANGE', message: 'Seats must be between 1 and 2', details: null } });\n    expect(handleTabulate('POST', JSON.stringify({ ballots: '1,A\\n1,B', seats: 0 })).body).toEqual({ error: { code: 'SEATS_OUT_OF_RANGE', message: 'Seats must be between 1 and 2', details: null } });\n  });\n\n  it('Hare quota is accepted for multi-seat STV and changes the quota', () => {\n    const droop = handleTabulate('POST', JSON.stringify({ ballots: food, seats: 3 })) as any;\n    const hare = handleTabulate('POST', JSON.stringify({ ballots: food, seats: 3, quota: 'hare' })) as any;\n    expect(droop.status).toBe(200);\n    expect(droop.body.method).toBe('stv');\n    expect(droop.body.quota).toBe('6.0000');\n    expect(hare.status).toBe(200);\n    expect(hare.body.quota).toBe('6.6667');\n    expect([...hare.body.winners].sort()).toEqual(['Chocolate', 'Oranges', 'Strawberries']);\n  });\n\n  it('report uploads use the same option checks', () => {\n    const r = handleReport('POST', { rawBody: JSON.stringify({ ballots: '1,A\\n1,B', rules: { tiebreak: 'coin' } }) });\n    expect(r.status).toBe(422);\n    expect(r.body).toEqual({ error: { code: 'INVALID_TIEBREAK', message: 'rules.tiebreak must be one of: previous-round, lot', details: { field: 'rules.tiebreak', value: 'coin' } } });\n  });\n\n  it('route serves the options document', async () => {\n    const res = await GET(new Request('http://localhost/api/options'));\n    expect(res.status).toBe(200);\n    const body = await res.json();\n    expect(body.tiebreak.options).toHaveLength(2);\n    expect(body.stv.quota.options).toHaveLength(2);\n  });\n});\n"},"test/health.test.ts":{"tests":[{"id":"72","name":"GET /api/health keeps ok and engineVersion and adds status, version, and election ids"}],"source":"import { describe, it, expect } from 'vitest';\nimport { ENGINE_VERSION } from '../src/api.js';\nimport { healthBody } from '../src/health.js';\nimport { GET } from '../app/api/health/route.js';\n\ndescribe('GET /api/health', () => {\n  it('keeps ok and engineVersion and adds status, version, and election ids', async () => {\n    const body = healthBody();\n    expect(body).toEqual({\n      ok: true,\n      engineVersion: ENGINE_VERSION,\n      status: 'ok',\n      version: ENGINE_VERSION,\n      elections: ['maine-2018-cd2', 'alaska-2022', 'nyc-2021'],\n    });\n    expect(body.version).toBe('0.1.0');\n    expect(body.version).toBe(body.engineVersion);\n\n    const res = GET();\n    expect(res.status).toBe(200);\n    expect(await res.json()).toEqual(body);\n  });\n});\n"},"test/maine.parity.test.ts":{"tests":[{"id":"73","name":"Maine 2018 CD2 — certified parity from official CVRs T21 round 1 matches certified exactly"},{"id":"74","name":"Maine 2018 CD2 — certified parity from official CVRs T22 final round matches certified exactly, 2 rounds via batch elimination"},{"id":"75","name":"Maine 2018 CD2 — certified parity from official CVRs official exhaustion categories match the SoS summary report in both rounds"},{"id":"76","name":"Maine 2018 CD2 — certified parity from official CVRs T28 rule sensitivity: overvote=skip differs from certified"},{"id":"77","name":"Maine 2018 CD2 — certified parity from official CVRs without batch elimination: 3 rounds, same final"}],"source":"import { describe, it, expect } from 'vitest';\nimport { tabulateIrv, maineCategories } from '../src/index.js';\nimport { MAINE_2018_CD2 as E } from '../src/elections/maine-2018-cd2.js';\ndescribe('Maine 2018 CD2 — certified parity from official CVRs', () => {\n  const r = tabulateIrv(E.load(), E.candidates, E.rules);\n  it('T21 round 1 matches certified exactly', () => { expect(r.totalBallots).toBe(296077); expect(r.rounds[0].tallies).toEqual(E.certified.round1); expect(r.rounds[0].threshold).toBe(144813); });\n  it('T22 final round matches certified exactly, 2 rounds via batch elimination', () => {\n    expect(r.rounds.length).toBe(2); expect(r.rounds[0].eliminated.sort()).toEqual(['Bond, Tiffany L.', 'Hoar, William R.S.']);\n    expect(r.rounds[1].tallies).toEqual(E.certified.final); expect(r.winner).toBe('DEM Golden, Jared F.');\n    expect(r.rounds[1].continuing).toBe(281371); expect(r.rounds[1].threshold).toBe(140686);\n    expect(r.rounds[1].transfers).toEqual({ 'REP Poliquin, Bruce': 4747, 'DEM Golden, Jared F.': 10427 });\n  });\n  it('official exhaustion categories match the SoS summary report in both rounds', () => {\n    expect(maineCategories(r.rounds[0])).toEqual({ overvotes: 435, undervotes: 6018, exhaustedChoices: 0, continuing: 289624 });\n    expect(maineCategories(r.rounds[1])).toEqual({ overvotes: 533, undervotes: 13838, exhaustedChoices: 335, continuing: 281371 });\n  });\n  it('T28 rule sensitivity: overvote=skip differs from certified', () => {\n    const s = tabulateIrv(E.load(), E.candidates, { ...E.rules, overvote: 'skip' });\n    const diff = Math.abs(s.rounds.at(-1)!.tallies['DEM Golden, Jared F.'] - 142440) + Math.abs(s.rounds.at(-1)!.tallies['REP Poliquin, Bruce'] - 138931);\n    expect(diff).toBeGreaterThan(0);\n  });\n  it('without batch elimination: 3 rounds, same final', () => {\n    const s = tabulateIrv(E.load(), E.candidates, { ...E.rules, batch: false });\n    expect(s.rounds.length).toBe(3); expect(s.rounds[2].tallies).toEqual(E.certified.final);\n  });\n});\n"},"test/alaska.api.test.ts":{"tests":[{"id":"78","name":"POST /api/tabulate Alaska 2022 declared continuing candidates allow Write-in and match the certified two-round count"},{"id":"79","name":"POST /api/tabulate Alaska 2022 without a candidate list, Write-in is passed over and the certified count still holds"},{"id":"80","name":"POST /api/tabulate Alaska 2022 listing Write-in makes it a continuing candidate"},{"id":"81","name":"POST /api/tabulate Alaska 2022 documents the Write-in convention on GET /api/options"}],"source":"import { describe, it, expect } from 'vitest';\nimport { handleTabulate } from '../src/api.js';\nimport { handleOptions } from '../src/options.js';\nimport { ALASKA_2022_SPECIAL as E } from '../src/elections/alaska-2022-special.js';\nimport { BallotGroup, Mark } from '../src/types.js';\n\nfunction rankToken(m: Mark): string {\n  if (m.kind === 'candidate') return m.name;\n  return m.kind === 'overvote' ? 'overvote' : 'undervote';\n}\n\nfunction bodyFor(groups: BallotGroup[], candidates?: string[]) {\n  return JSON.stringify({\n    ballots: groups.map(g => ({ count: g.count, ranks: g.marks.map(rankToken) })),\n    rules: E.rules,\n    ...(candidates ? { candidates } : {}),\n  });\n}\n\ndescribe('POST /api/tabulate Alaska 2022', () => {\n  const groups = E.load();\n\n  it('declared continuing candidates allow Write-in and match the certified two-round count', () => {\n    const r = handleTabulate('POST', bodyFor(groups, E.candidates)) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.totalBallots).toBe(192289);\n    expect(r.body.rounds).toHaveLength(2);\n    expect(r.body.rounds[0].tallies).toEqual(E.certified.rounds[0].tallies);\n    expect(r.body.rounds[1].tallies).toEqual({ 'Palin, Sarah': 86026, 'Peltola, Mary S.': 91266 });\n    expect(r.body.winner).toBe('Peltola, Mary S.');\n    expect(r.body.candidates).toEqual(E.candidates);\n  });\n\n  it('without a candidate list, Write-in is passed over and the certified count still holds', () => {\n    const r = handleTabulate('POST', bodyFor(groups)) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.rounds).toHaveLength(2);\n    expect(r.body.rounds[0].tallies).toEqua
