l(E.certified.rounds[0].tallies);\n    expect(r.body.rounds[1].tallies).toEqual(E.certified.rounds[1].tallies);\n    expect(r.body.winner).toBe('Peltola, Mary S.');\n    expect(r.body.candidates).not.toContain('Write-in');\n  });\n\n  it('listing Write-in makes it a continuing candidate', () => {\n    const r = handleTabulate('POST', JSON.stringify({\n      ballots: [{ count: 3, ranks: ['Write-in'] }, { count: 2, ranks: ['A'] }],\n      candidates: ['Write-in', 'A'],\n    })) as any;\n    expect(r.status).toBe(200);\n    expect(r.body.rounds[0].tallies).toEqual({ 'Write-in': 3, A: 2 });\n    expect(r.body.winner).toBe('Write-in');\n  });\n\n  it('documents the Write-in convention on GET /api/options', () => {\n    const body = handleOptions('GET').body as { writeIn: { name: string; description: string } };\n    expect(body.writeIn.name).toBe('Write-in');\n    expect(body.writeIn.description).toContain('Alaska');\n    expect(body.writeIn.description).toContain('passed over');\n  });\n});\n"},"test/mutation-gaps.test.ts":{"tests":[{"id":"82","name":"Fraction normalisation and formatting rejects a zero denominator"},{"id":"83","name":"Fraction normalisation and formatting moves the sign to the numerator and reduces negatives"},{"id":"84","name":"Fraction normalisation and formatting cmp returns 0 for equal values written differently"},{"id":"85","name":"Fraction normalisation and formatting toFixed keeps the sign, and drops it when the value rounds to zero"},{"id":"86","name":"Fraction normalisation and formatting isZero and toNumber"},{"id":"87","name":"IRV paths the parity fixtures never hit throws on an empty candidate list"},{"id":"88","name":"IRV paths the parity fixtures never hit a tied final two is not a win: lot order eliminates the later-declared candidate first"},{"id":"89","name":"IRV paths the parity fixtures never hit previous-round tiebreak looks back one round"},{"id":"90","name":"IRV paths the parity fixtures never hit lot tiebreak ignores earlier rounds"},{"id":"91","name":"IRV paths the parity fixtures never hit previous-round falls back to lot when there is no earlier round"},{"id":"92","name":"IRV paths the parity fixtures never hit batch elimination needs the bottom group to be strictly below the next candidate"},{"id":"93","name":"IRV paths the parity fixtures never hit labels each inactive reason"},{"id":"94","name":"STV edges allows seats equal to the number of candidates"},{"id":"95","name":"STV edges an overvote exhausts the paper instead of skipping to the next rank"},{"id":"96","name":"STV edges equal tallies: the later-declared candidate is eliminated"}],"source":"// Tests for behaviour that Stryker showed was untested (audit/mutation/README.md).\nimport { describe, it, expect } from 'vitest';\nimport { Fraction, tabulateIrv, tabulateStv, BallotGroup, Mark } from '../src/index.js';\nconst c = (name: string): Mark => ({ kind: 'candidate', name });\nconst S: Mark = { kind: 'skip' }, O: Mark = { kind: 'overvote' };\nconst g = (count: number, ...marks: Mark[]): BallotGroup => ({ count, marks });\n\ndescribe('Fraction normalisation and formatting', () => {\n  it('rejects a zero denominator', () => { expect(() => new Fraction(1, 0)).toThrow(/zero denominator/); });\n  it('moves the sign to the numerator and reduces negatives', () => {\n    const a = new Fraction(1, -2); expect([a.n, a.d]).toEqual([-1n, 2n]);\n    const b = new Fraction(-2, 4); expect([b.n, b.d]).toEqual([-1n, 2n]);\n    const z = new Fraction(0, -5); expect([z.n, z.d]).toEqual([0n, 1n]);\n  });\n  it('cmp returns 0 for equal values written differently', () => { expect(new Fraction(2, 4).cmp(new Fraction(1, 2))).toBe(0); expect(new Fraction(1, 3).cmp(new Fraction(1, 2))).toBe(-1); });\n  it('toFixed keeps the sign, and drops it when the value rounds to zero', () => {\n    expect(new Fraction(-1, 3).toFixed(2)).toBe('-0.33'); expect(new Fraction(-1, 1000).toFixed(2)).toBe('0.00'); expect(new Fraction(7, 2).toFixed(0)).toBe('4');\n  });\n  it('isZero and toNumber', () => { expect(Fraction.ZERO.isZero()).toBe(true); expect(new Fraction(1, 4).isZero()).toBe(false); expect(new Fraction(1, 4).toNumber()).toBe(0.25); });\n});\n\ndescribe('IRV paths the parity fixtures never hit', () => {\n  it('throws on an empty candidate list', () => { expect(() => tabulateIrv([], [])).toThrow('No candidates'); });\n  it('a tied final two is not a win: lot order eliminates the later-declared candidate first', () => {\n    const r = tabulateIrv([g(1, c('A')), g(1, c('B'))], ['A', 'B'], { tiebreak: 'lot' });\n    expect(r.rounds.length).toBe(2); expect(r.rounds[0].eliminated).toEqual(['B']); expect(r.rounds[0].tieNote).toBe('lot'); expect(r.winner).toBe('A');\n  });\n  const tie = [g(5, c('A')), g(3, c('B')), g(4, c('C')), g(1, c('D'), c('B'))];\n  it('previous-round tiebreak looks back one round', () => {\n    const r = tabulateIrv(tie, ['A', 'B', 'C', 'D'], { tiebreak: 'previous-round' });\n    expect(r.rounds[1].tallies).toEqual({ A: 5, B: 4, C: 4 }); expect(r.rounds[1].eliminated).toEqual(['B']); expect(r.rounds[1].tieNote).toBe('previous-round');\n  });\n  it('lot tiebreak ignores earlier rounds', () => {\n    const r = tabulateIrv(tie, ['A', 'B', 'C', 'D'], { tiebreak: 'lot' });\n    expect(r.rounds[1].eliminated).toEqual(['C']); expect(r.rounds[1].tieNote).toBe('lot');\n  });\n  it('previous-round falls back to lot when there is no earlier round', () => {\n    const r = tabulateIrv([g(2, c('A')), g(1, c('B')), g(1, c('C'))], ['A', 'B', 'C'], { tiebreak: 'previous-round' });\n    expect(r.rounds[0].eliminated).toEqual(['C']); expect(r.rounds[0].tieNote).toBe('lot');\n  });\n  it('batch elimination needs the bottom group to be strictly below the next candidate', () => {\n    const r = tabulateIrv([g(10, c('A')), g(5, c('B')), g(3, c('C')), g(2, c('D'))], ['A', 'B', 'C', 'D'], { batch: true });\n    expect(r.rounds[0].eliminated).toEqual(['D']);\n  });\n  it('labels each inactive reason', () => {\n    const ballots = [g(1, S, S), g(1, O, c('A')), g(1, c('B'), S, S, c('C')), g(1, c('B'), S), g(1, c('B'))];\n    const r = tabulateIrv([...ballots, g(4, c('A')), g(3, c('C'))], ['A', 'C', 'B'], { skips: 'two-exhaust', overvote: 'exhaust', tiebreak: 'lot' });\n    const last = r.rounds[r.rounds.length - 1].inactive;\n    expect(last).toEqual({ blank: 1, overvote: 1, skips: 1, undervote: 1, exhausted: 1 });\n  });\n});\n\ndescribe('STV edges', () => {\n  it('allows seats equal to the number of candidates', () => {\n    expect(tabulateStv([g(2, c('A')), g(1, c('B'))], ['A', 'B'], 2).winners.sort()).toEqual(['A', 'B']);\n    expect(() => tabulateStv([g(1, c('A'))], ['A'], 2)).toThrow(RangeError);\n  });\n  it('an overvote exhausts the paper instead of skipping to the next rank', () => {\n    const r = tabulateStv([g(3, O, c('A')), g(2, c('B')), g(1, c('A'))], ['A', 'B'], 1);\n    expect(r.rounds[0].tallies).toEqual({ A: '1.0000', B: '2.0000' }); expect(r.rounds[0].exhausted).toBe('3.0000');\n  });\n  it('equal tallies: the later-declared candidate is eliminated', () => {\n    const r = tabulateStv([g(2, c('A')), g(1, c('B')), g(1, c('C'))], ['A', 'B', 'C'], 1);\n    expect(r.rounds[0].eliminated).toEqual(['C']); expect(r.rounds[1].eliminated).toEqual(['B']); expect(r.winners).toEqual(['A']);\n  });\n});\n"},"test/irv.test.ts":{"tests":[{"id":"97","name":"single-winner IRV fixtures (hand-computed) T01 majority in round 1"},{"id":"98","name":"single-winner IRV fixtures (hand-computed) T02 comeback over three rounds"},{"id":"99","name":"single-winner IRV fixtures (hand-computed) T03 exhausted ballots counted"},{"id":"100","name":"single-winner IRV fixtures (hand-computed) T04 threshold uses continuing ballots, not total"},{"id":"101","name":"single-winner IRV fixtures (hand-computed) T05 tie broken by previous round"},{"id":"102","name":"single-winner IRV fixtures (hand-computed) T06/T07 lot order decides a first-round tie and flips the winner"},{"id":"103","name":"single-winner IRV fixtures (hand-computed) T08/T09 overvote exhaust vs skip flips the winner"},{"id":"104","name":"single-winner IRV fixtures (hand-computed) T10/T11 skipped ranks: continue vs two-consecutive exhaust"},{"id":"105","name":"single-winner IRV fixtures (hand-computed) T12 duplicate ranking is ignored, ballot continues"},{"id":"106","name":"single-winner IRV fixtures (hand-computed) T13 batch elimination changes the round count, not the winner"},{"id":"107","name":"single-winner IRV fixtures (hand-computed) T14 scale invariance ×1000"},{"id":"108","name":"single-winner IRV fixtures (hand-computed) T15 uncontested race"},{"id":"109","name":"single-winner IRV fixtures (hand-computed) T16 conservation: continuing + inactive = total every round, inactive never decreases"},{"id":"110","name":"single-winner IRV fixtures (hand-computed) blank ballots are inactive from round 1"},{"id":"111","name":"single-winner IRV fixtures (hand-computed) rejects a lotOrder missing a candidate"}],"source":"import { describe, it, expect } from 'vitest';\nimport { parseBallots, tabulateIrv, Rules } from '../src/index.js';\nconst run = (text: string, rules: Partial<"+"Rules> = {}, declared?: string[]) => { const { ballots, candidates } = parseBallots(text, declared); return tabulateIrv(ballots, candidates, rules); };\nconst T = (r: ReturnType<"+"typeof run>, i: number) => r.rounds[i].tallies;\n\ndescribe('single-winner IRV fixtures (hand-computed)', () => {\n  it('T01 majority in round 1', () => {\n    const r = run('6,A\\n3,B\\n1,C');\n    expect(r.rounds.length).toBe(1); expect(r.winner).toBe('A'); expect(r.rounds[0].threshold).toBe(6); expect(T(r, 0).A).toBe(6);\n  });\n  it('T02 comeback over three rounds', () => {\n    const r = run('8,A>D\\n6,B>C\\n4,C>B\\n3,D>C');\n    expect(T(r, 0)).toEqual({ A: 8, B: 6, C: 4, D: 3 }); expect(r.rounds[0].eliminated).toEqual(['D']);\n    expect(T(r, 1)).toEqual({ A: 8, B: 6, C: 7 }); expect(r.rounds[1].eliminated).toEqual(['B']);\n    expect(T(r, 2)).toEqual({ A: 8, C: 13 }); expect(r.winner).toBe('C'); expect(r.rounds[0].threshold).toBe(11);\n  });\n  it('T03 exhausted ballots counted', () => {\n    const r = run('7,A\\n6,B\\n4,C>A\\n3,D');\n    expect(r.rounds[1].inactive.exhausted).toBe(3); expect(T(r, 1)).toEqual({ A: 7, B: 6, C: 4 }); expect(T(r, 2)).toEqual({ A: 11, B: 6 });\n    expect(r.rounds[2].continuing).toBe(17);\n  });\n  it('T04 threshold uses continuing ballots, not total', () => {\n    const r = run('6,A\\n6,B\\n5,C\\n3,D>A');\n    expect(T(r, 1)).toEqual({ A: 9, B: 6, C: 5 }); expect(T(r, 2)).toEqual({ A: 9, B: 6 });\n    expect(r.rounds[2].threshold).toBe(8); expect(r.winner).toBe('A'); expect(r.rounds[2].inactive.exhausted).toBe(5);\n  });\n  it('T05 tie broken by previous round', () => {\n    const r = run('10,A\\n7,B\\n6,C>A\\n5,D>B\\n1,E>D>B');\n    expect(T(r, 1)).toEqual({ A: 10, B: 7, C: 6, D: 6 }); expect(r.rounds[1].eliminated).toEqual(['D']); expect(r.rounds[1].tieNote).toBe('previous-round');\n    expect(T(r, 2)).toEqual({ A: 10, B: 13, C: 6 }); expect(T(r, 3)).toEqual({ A: 16, B: 13 }); expect(r.winner).toBe('A'); expect(r.rounds.length).toBe(4);\n  });\n  it('T06/T07 lot order decides a first-round tie and flips the winner', () => {\n    const f = '5,A\\n3,B>C\\n3,C>B';\n    const a = run(f, { lotOrder: ['A', 'B', 'C'] }); expect(a.rounds[0].eliminated).toEqual(['C']); expect(a.rounds[0].tieNote).toBe('lot'); expect(T(a, 1)).toEqual({ A: 5, B: 6 }); expect(a.winner).toBe('B');\n    const b = run(f, { lotOrder: ['A', 'C', 'B'] }); expect(b.rounds[0].eliminated).toEqual(['B']); expect(T(b, 1)).toEqual({ A: 5, C: 6 }); expect(b.winner).toBe('C');\n  });\n  it('T08/T09 overvote exhaust vs skip flips the winner', () => {\n    const f = '4,A\\n4,B\\n1,C>A\\n2,C>[A=B]>B';\n    const e = run(f, { overvote: 'exhaust' }); expect(T(e, 1)).toEqual({ A: 5, B: 4 }); expect(e.rounds[1].inactive.overvote).toBe(2); expect(e.winner).toBe('A');\n    const s = run(f, { overvote: 'skip' }); expect(T(s, 1)).toEqual({ A: 5, B: 6 }); expect(s.rounds[1].inactive.overvote).toBe(0); expect(s.winner).toBe('B');\n  });\n  it('T10/T11 skipped ranks: continue vs two-consecutive exhaust', () => {\n    const f = '4,A\\n4,B\\n1,C>_>A\\n2,C>_>_>B';\n    const c = run(f, { skips: 'continue' }); expect(T(c, 1)).toEqual({ A: 5, B: 6 }); expect(c.winner).toBe('B');\n    const x = run(f, { skips: 'two-exhaust' }); expect(T(x, 1)).toEqual({ A: 5, B: 4 }); expect(x.rounds[1].inactive.skips).toBe(2); expect(x.winner).toBe('A');\n  });\n  it('T12 duplicate ranking is ignored, ballot continues', () => {\n    const r = run('5,B\\n4,C\\n2,A>A>C');\n    expect(T(r, 0)).toEqual({ B: 5, C: 4, A: 2 }); expect(T(r, 1)).toEqual({ B: 5, C: 6 }); expect(r.winner).toBe('C'); expect(r.rounds[1].inactive.exhausted).toBe(0);\n  });\n  it('T13 batch elimination changes the round count, not the winner', () => {\n    const f = '45,A\\n40,B\\n9,C>A\\n6,D>B';\n    const on = run(f, { batch: true }); expect(on.rounds[0].eliminated.sort()).toEqual(['C', 'D']); expect(on.rounds.length).toBe(2); expect(T(on, 1)).toEqual({ A: 54, B: 46 });\n    const off = run(f, { batch: false }); expect(off.rounds.length).toBe(3); expect(T(off, 1)).toEqual({ A: 45, B: 46, C: 9 }); expect(T(off, 2)).toEqual({ A: 54, B: 46 });\n    expect(on.winner).toBe('A'); expect(off.winner).toBe('A');\n  });\n  it('T14 scale invariance ×1000', () => {\n    const r = run('8000,A>D\\n6000,B>C\\n4000,C>B\\n3000,D>C');\n    expect(T(r, 0)).toEqual({ A: 8000, B: 6000, C: 4000, D: 3000 }); expect(T(r, 2)).toEqual({ A: 8000, C: 13000 });\n  });\n  it('T15 uncontested race', () => { const r = run('5,A'); expect(r.rounds.length).toBe(1); expect(r.winner).toBe('A'); expect(r.rounds[0].continuing).toBe(5); });\n  it('T16 conservation: continuing + inactive = total every round, inactive never decreases', () => {\n    const r = run('6,A\\n6,B\\n5,C\\n3,D>A');\n    let prev = 0;\n    for (const rd of r.rounds) { const inact = Object.values(rd.inactive).reduce((a, b) => a + b, 0); expect(rd.continuing + inact).toBe(20); expect(inact).toBeGreaterThanOrEqual(prev); prev = inact; }\n    expect(r.rounds[2].continuing).toBe(15);\n  });\n  it('blank ballots are inactive from round 1', () => {\n    const r = run('3,A\\n2,B\\n1,_>_', { skips: 'two-exhaust' }); expect(r.rounds[0].inactive.blank).toBe(1); expect(r.rounds[0].continuing).toBe(5);\n  });\n  it('rejects a lotOrder missing a candidate', () => {\n    expect(() => run('1,A\\n1,B', { lotOrder: ['A'] })).toThrow('lotOrder is missing candidate \"B\"');\n  });\n});\n"},"test/input-edges.test.ts":{"tests":[{"id":"112","name":"BUG-002: count,ranking header line is skipped, not counted as a ballot for candidates \"count\" and \"ranking\""},{"id":"113","name":"BUG-002: count,ranking header line accepts CRLF, BOM and multi-rank rows after the header"},{"id":"114","name":"BUG-002: count,ranking header line a header with no ballots is NO_BALLOTS, not a 1-ballot election"},{"id":"115","name":"BUG-003: candidate names that are Object.prototype keys \"__proto__\" keeps its votes"},{"id":"116","name":"BUG-003: candidate names that are Object.prototype keys \"constructor\" keeps its votes"},{"id":"117","name":"BUG-003: candidate names that are Object.prototype keys \"toString\" keeps its votes"},{"id":"118","name":"BUG-003: candidate names that are Object.prototype keys \"hasOwnProperty\" keeps its votes"},{"id":"119","name":"BUG-003: candidate names that are Object.prototype keys also through JSON ranks"},{"id":"120","name":"BUG-004: counts beyond exact integer range CSV count above 2^53 is rejected, not silently rounded"},{"id":"121","name":"BUG-004: counts beyond exact integer range JSON count 1e308 is rejected as INVALID_COUNT"},{"id":"122","name":"BUG-004: counts beyond exact integer range a total above 2^53 is rejected even when each count is safe"},{"id":"123","name":"BUG-004: counts beyond exact integer range the largest safe count still counts exactly"}],"source":"// Regression guards for BUG-002..004 (audit/defects.md), found by probing POST /api/tabulate with edge-case input.\nimport { describe, it, expect } from 'vitest';\nimport { handleTabulate } from '../src/api.js';\n\nconst csv = (body: string) => handleTabulate('POST', body);\nconst json = (body: unknown) => handleTabulate('POST', JSON.stringify(body));\nconst ok = (r: ReturnType<"+"typeof handleTabulate>) => { expect(r.status).toBe(200); return r.body as any; };\nconst err = (r: ReturnType<"+"typeof handleTabulate>) => (r.body as any).error;\n\ndescribe('BUG-002: count,ranking header line', () => {\n  it('is skipped, not counted as a ballot for candidates \"count\" and \"ranking\"', () => {\n    const j = ok(csv('count,ranking\\n3,A\\n2,B\\n'));\n    expect(j.candidates).toEqual(['A', 'B']);\n    expect(j.totalBallots).toBe(5);\n    expect(j.rounds[0].tallies).toEqual({ A: 3, B: 2 });\n  });\n  it('accepts CRLF, BOM and multi-rank rows after the header', () => {\n    const j = ok(csv('\\uFEFFCount,Ranking\\r\\n4,A\\r\\n3,B>A\\r\\n2,C>B\\r\\n'));\n    expect(j.winner).toBe('B');\n  });\n  it('a header with no ballots is NO_BALLOTS, not a 1-ballot election', () => {\n    const r = csv('count,ranking\\n');\n    expect(r.status).toBe(422);\n    expect(err(r).code).toBe('NO_BALLOTS');\n  });\n});\n\ndescribe('BUG-003: candidate names that are Object.prototype keys', () => {\n  for (const name of ['__proto__', 'constructor', 'toString', 'hasOwnProperty']) {\n    it(`\"${name}\" keeps its votes`, () => {\n      const j = ok(csv(`3,${name}\\n2,B\\n`));\n      expect(j.rounds[0].tallies[name]).toBe(3);\n      expect(j.winner).toBe(name);\n      expect(JSON.parse(JSON.stringify(j)).rounds[0].tallies[name]).toBe(3);\n    });\n  }\n  it('also through JSON ranks', () => {\n    const j = ok(json({ ballots: [{ count: 3, ranks: ['__proto__'] }, { count: 2, ranks: ['B'] }] }));\n    expect(j.winner).toBe('__proto__');\n  });\n});\n\ndescribe('BUG-004: counts beyond exact integer range', () => {\n  it('CSV count above 2^53 is rejected, not silently rounded', () => {\n    const r = csv('99999999999999999999,A\\n1,B\\n');\n    expect(r.status).toBe(422);\n    expect(err(r).code).toBe('INVALID_COUNT');\n  });\n  it('JSON count 1e308 is rejected as INVALID_COUNT', () => {\n    const r = json({ ballots: [{ count: 1e308, ranks: ['A'] }, { count: 1, ranks: ['B'] }] });\n    expect(r.status).toBe(422);\n    expect(err(r).code).toBe('INVALID_COUNT');\n  });\n  it('a total above 2^53 is rejected even when each count is safe', () => {\n    const big = Number.MAX_SAFE_INTEGER - 1;\n    const r = json({ ballots: [{ count: big, ranks: ['A'] }, { count: big, ranks: ['B'] }] });\n    expect(r.status).toBe(422);\n    expect(err(r).code).toBe('INVALID_COUNT');\n  });\n  it('the largest safe count still counts exactly', () => {\n    const j = ok(json({ ballots: [{ count: Number.MAX_SAFE_INTEGER - 1, ranks: ['A'] }, { count: 1, ranks: ['B'] }] }));\n    expect(j.totalBallots).toBe(Number.MAX_SAFE_INTEGER);\n  });\n});\n"},"test/stv.test.ts":{"tests":[{"id":"124","name":"STV (exact rationals) T17 food election, Droop, 3 seats"},{"id":"125","name":"STV (exact rationals) T18 fractional surplus stays exact"},{"id":"126","name":"STV (exact rationals) T19 Hare quota variant"},{"id":"127","name":"STV (exact rationals) T20 seats validation"},{"id":"128","name":"STV (exact rationals) Fraction: 1/3 + 1/3 + 1/3 is exactly 1 (float gives 0.9999… in chains)"}],"source":"import { describe, it, expect } from 'vitest';\nimport { parseBallots, tabulateStv, Fraction } from '../src/index.js';\nconst food = '4,Oranges\\n2,Pears>Oranges\\n8,Chocolate>Strawberries\\n4,Chocolate>Hamburgers\\n1,Strawberries\\n1,Hamburgers';\ndescribe('STV (exact rationals)', () => {\n  it('T17 food election, Droop, 3 seats', () => {\n    const { ballots, candidates } = parseBallots(food); const r = tabulateStv(ballots, candidates, 3);\n    expect(r.quota).toBe('6.0000'); expect(r.rounds[0].elected).toEqual(['Chocolate']); expect(r.rounds[0].tallies.Chocolate).toBe('12.0000');\n    expect(r.rounds[1].tallies.Strawberries).toBe('5.0000'); expect(r.rounds[1].tallies.Hamburgers).toBe('3.0000'); expect(r.rounds[1].eliminated).toEqual(['Pears']);\n    expect(r.rounds[2].tallies.Oranges).toBe('6.0000'); expect([...r.winners].sort()).toEqual(['Chocolate', 'Oranges', 'Strawberries']);\n  });\n  it('T18 fractional surplus stays exact', () => {\n    const { ballots, candidates } = parseBallots('3,A>B\\n3,A>C\\n2,B\\n1,C\\n4,D'); const r = tabulateStv(ballots, candidates, 2);\n    expect(r.quota).toBe('5.0000'); expect(r.rounds[1].tallies).toEqual({ B: '2.5000', C: '1.5000', D: '4.0000' });\n    expect(r.rounds[1].eliminated).toEqual(['C']); expect(r.rounds[2].exhausted).toBe('1.5000'); expect(r.winners.sort()).toEqual(['A', 'D']);\n  });\n  it('T19 Hare quota variant', () => {\n    const { ballots, candidates } = parseBallots(food); const r = tabulateStv(ballots, candidates, 3, 'hare');\n    expect(r.quota).toBe('6.6667'); expect(r.rounds[1].tallies.Strawberries).toBe('4.5556'); expect(r.rounds[1].tallies.Hamburgers).toBe('2.7778');\n    expect([...r.winners].sort()).toEqual(['Chocolate', 'Oranges', 'Strawberries']);\n  });\n  it('T20 seats validation', () => {\n    const { ballots, candidates } = parseBallots(food);\n    expect(() => tabulateStv(ballots, candidates, 6)).toThrow('Seats must be between 1 and 5');\n    expect(() => tabulateStv(ballots, candidates, 0)).toThrow('Seats must be between 1 and 5');\n  });\n  it('Fraction: 1/3 + 1/3 + 1/3 is exactly 1 (float gives 0.9999… in chains)', () => {\n    const t = new Fraction(1, 3); expect(t.add(t).add(t).cmp(Fraction.of(1))).toBe(0); expect(new Fraction(2, 3).toFixed(4)).toBe('0.6667'); expect(new Fraction(-1, 2).toFixed(0)).toBe('-1');\n  });\n});\n"},"test/parse-gaps.test.ts":{"tests":[{"id":"129","name":"ranking lines strips a byte-order mark and reads the header only on the first line"},{"id":"130","name":"ranking lines a count must be a whole positive number with nothing after it"},{"id":"131","name":"ranking lines a line without a comma is rejected"},{"id":"132","name":"ranking lines special tokens must be the whole cell; spaces around them are trimmed"},{"id":"133","name":"ranking lines quotes around a name are removed, quotes inside are kept"},{"id":"134","name":"ranking lines write-in continues only when the declared list includes it"},{"id":"135","name":"CSV rows handles CRLF, bare CR, escaped quotes, BOM and a trailing newline"},{"id":"136","name":"CSV rows rejects an unterminated quote"},{"id":"137","name":"rank-column CSV recognises rank, count and ignored headers"},{"id":"138","name":"rank-column CSV a header row that is only a header is not a ballot"},{"id":"139","name":"rank-column CSV rejects a count column value that is not a plain positive integer"},{"id":"140","name":"rank-column CSV skips blank rows and comment-only rows"},{"id":"141","name":"rank-column CSV headerless two-column file: a leading integer is a count, two names are two ranks"},{"id":"142","name":"rank-column CSV a purely numeric candidate in column 1 without a header is ambiguous"},{"id":"143","name":"JSON ballots accepts strings, arrays and { count, ranks | ranking }; null and \"\" are skipped ranks"},{"id":"144","name":"JSON ballots rejects non-string ranks, bad counts, non-object items and non-arrays"}],"source":"// Parser behaviour that Stryker showed was untested (surviving mutants in src/parse.ts, not message text).\nimport { describe, it, expect } from 'vitest';\nimport { parseBallots, parseRankCsv, parseCsvRows, parseBallotJson, writeInContinues, WRITE_IN } from '../src/parse.js';\nconst names = (r: { ballots: { marks: { kind: string; name?: string }[] }[] }) => r.ballots.map(b => b.marks.map(m => m.kind === 'candidate' ? m.name : m.kind).join('>'));\n\ndescribe('ranking lines', () => {\n  it('strips a byte-order mark and reads the header only on the first line', () => {\n    expect(names(parseBallots('\\uFEFF3,A>B'))).toEqual(['A>B']);\n    expect(parseBallots('count,ranking\\n2,A').ballots).toEqual([{ count: 2, marks: [{ kind: 'candidate', name: 'A' }] }]);\n    expect(() => parseBallots('2,A\\ncount,ranking')).toThrow(/Line 2/);\n  });\n  it('a count must be a whole positive number with nothing after it', () => {\n    for (const bad of ['10abc,A', '012,A', '0,A', 'x1,A']) expect(() => parseBallots(bad)).toThrow(/Line 1/);\n  });\n  it('a line without a comma is rejected', () => { expect(() => parseBallots('A>B')).toThrow(/Line 1/); });\n  it('special tokens must be the whole cell; spaces around them are trimmed', () => {\n    expect(names(parseBallots('1, overvote >A> undervote >B'))).toEqual(['overvote>A>skip>B']);\n    expect(names(parseBallots('1,undervoteX>[A=B]x>overvotes'))).toEqual(['undervoteX>[A=B]x>overvotes']);\n    expect(names(parseBallots('1,[A=B]>_>>B'))).toEqual(['overvote>skip>skip>B']);\n  });\n  it('quotes around a name are removed, quotes inside are kept', () => {\n    expect(names(parseBallots('1,\"Smith, Jr.\">Lee'))).toEqual(['Smith, Jr.>Lee']);\n    expect(names(parseBallots('1,\"A\"B\">C'))).toEqual(['A\"B>C']);\n  });\n  it('write-in continues only when the declared list includes it', () => {\n    expect(writeInContinues(WRITE_IN, [WRITE_IN, 'A'])).toBe(true);\n    expect(writeInContinues(WRITE_IN, ['A'])).toBe(false);\n    expect(writeInContinues(WRITE_IN)).toBe(false);\n    expect(writeInContinues('A', ['A', WRITE_IN])).toBe(false);\n  });\n});\n\ndescribe('CSV rows', () => {\n  it('handles CRLF, bare CR, escaped quotes, BOM and a trailing newline', () => {\n    expect(parseCsvRows('a,b\\r\\nc,d\\r\\n')).toEqual([['a', 'b'], ['c', 'd']]);\n    expect(parseCsvRows('a,b\\rc,d')).toEqual([['a', 'b'], ['c', 'd']]);\n    expect(parseCsvRows('\"a\"\"b\",c')).toEqual([['a\"b', 'c']]);\n    expect(parseCsvRows('\\uFEFFa,\"x\\ny\"')).toEqual([['a', 'x\\ny']]);\n    expect(parseCsvRows('a,\\n')).toEqual([['a', '']]);\n  });\n  it('rejects an unterminated quote', () => { expect(() => parseCsvRows('\"abc')).toThrow(); });\n});\n\ndescribe('rank-column CSV', () => {\n  it('recognises rank, count and ignored headers', () => {\n    expect(parseRankCsv('count,rank1,rank2\\n2,A,B').ballots).toEqual([{ count: 2, marks: [{ kind: 'candidate', name: 'A' }, { kind: 'candidate', name: 'B' }] }]);\n    expect(names(parseRankCsv('id,Rank 1,Rank 2\\n7,A,B'))).toEqual(['A>B']);\n    expect(names(parseRankCsv('1st choice,2nd choice\\nA,B\\nB,'))).toEqual(['A>B', 'B>skip']);\n  });\n  it('a header row that is only a header is not a ballot', () => { expect(() => parseRankCsv('rank1,rank2\\n')).toThrow(/No valid ballots/); });\n  it('rejects a count column value that is not a plain positive integer', () => {\n    for (const bad of ['1e3', '012', '-1', '']) expect(() => parseRankCsv(`count,rank1\\n${bad},A`)).toThrow(/count must be a positive integer/);\n  });\n  it('skips blank rows and comment-only rows', () => {\n    expect(names(parseRankCsv('\\n,,\\n# note,,\\nA,B'))).toEqual(['A>B']);\n  });\n  it('headerless two-column file: a leading integer is a count, two names are two ranks', () => {\n    expect(parseRankCsv('3,A\\n2,B').ballots.map(b => b.count)).toEqual([3, 2]);\n    expect(names(parseRankCsv('A,B\\nB,A'))).toEqual(['A>B', 'B>A']);\n  });\n  it('a purely numeric candidate in column 1 without a header is ambiguous', () => {\n    expect(() => parseRankCsv('3,A,B')).toThrow(/purely numeric/);\n  });\n});\n\ndescribe('JSON ballots', () => {\n  it('accepts strings, arrays and { count, ranks | ranking }; null and \"\" are skipped ranks', () => {\n    expect(names(parseBallotJson(['A>B', ['A', '', 'B'], { count: 2, ranks: ['B', null, 'A'] }, { count: 1, ranking: 'B>A' }]))).toEqual(['A>B', 'A>skip>B', 'B>skip>A', 'B>A']);\n    expect(names(parseBallotJson('2,A>B'))).toEqual(['A>B']);\n  });\n  it('rejects non-string ranks, bad counts, non-object items and non-arrays', () => {\n    expect(() => parseBallotJson([['A', 5]])).toThrow(/rank 2/);\n    expect(() => parseBallotJson([{ count: 1, ranks: ['A', 5] }])).toThrow(/rank 2/);\n    for (const count of [0, 1.5, '2', -1]) expect(() => parseBallotJson([{ count, ranks: ['A'] }])).toThrow(/count/);\n    expect(() => parseBallotJson([null])).toThrow(/Ballot 1/);\n    expect(() => parseBallotJson([7])).toThrow(/Ballot 1/);\n    expect(() => parseBallotJson({ a: 1 })).toThrow(/must be a ranking string or an array/);\n    expect(() => parseBallotJson([])).toThrow(/No valid ballots/);\n  });\n});\n"},"test/parse.test.ts":{"tests":[{"id":"145","name":"ballot parser T31 unknown candidate reports line number"},{"id":"146","name":"ballot parser T32 empty input"},{"id":"147","name":"ballot parser T33 bad count"},{"id":"148","name":"ballot parser T34 BOM, CRLF and quoted names with commas"},{"id":"149","name":"ballot parser T35 composed and decomposed names merge (NFC)"},{"id":"150","name":"ballot parser marks overvotes and skips"},{"id":"151","name":"ballot parser overvote and undervote tokens match the pattern-file convention"},{"id":"152","name":"ballot parser Write-in is a mark, and a continuing candidate only when declared"},{"id":"153","name":"ballot parser ignores comment lines"}],"source":"import { describe, it, expect } from 'vitest';\nimport { parseBallots, tabulateIrv } from '../src/index.js';\ndescribe('ballot parser', () => {\n  it('T31 unknown candidate reports line number', () => {\n    expect(() => parseBallots('1,A\\n1,B\\n1,C\\n1,Zed>A', ['A', 'B', 'C'])).toThrow('Line 4: unknown candidate \"Zed\"');\n  });\n  it('T32 empty input', () => { expect(() => parseBallots('\\n  \\n')).toThrow('No valid ballots to count'); });\n  it('T33 bad count', () => {\n    expect(() => parseBallots('x,A>B')).toThrow('Line 1: count must be a positive integer');\n    expect(() => parseBallots('0,A')).toThrow('count must be a positive integer');\n    expect(() => parseBallots('1.5,A')).toThrow('count must be a positive integer');\n  });\n  it('T34 BOM, CRLF and quoted names with commas', () => {\n    const { ballots, candidates } = parseBallots('\\uFEFF3,\"Smith, Jr.\">Lee\\r\\n2,Lee');\n    expect(candidates).toEqual(['Smith, Jr.', 'Lee']); expect(ballots[0].count).toBe(3);\n    const r = tabulateIrv(ballots, candidates); expect(r.winner).toBe('Smith, Jr.'); expect(r.rounds.length).toBe(1);\n  });\n  it('T35 composed and decomposed names merge (NFC)', () => {\n    const { candidates } = parseBallots('3,Jos\\u00e9\\n2,Jose\\u0301'); expect(candidates).toEqual(['Jos\\u00e9']);\n  });\n  it('marks overvotes and skips', () => {\n    const { ballots } = parseBallots('1,_>[A=B]>C');\n    expect(ballots[0].marks.map(m => m.kind)).toEqual(['skip', 'overvote', 'candidate']);\n  });\n  it('overvote and undervote tokens match the pattern-file convention', () => {\n    const { ballots, candidates } = parseBallots('2,A>overvote>undervote');\n    expect(ballots[0].marks.map(m => m.kind)).toEqual(['candidate', 'overvote', 'skip']);\n    expect(candidates).toEqual(['A']);\n  });\n  it('Write-in is a mark, and a continuing candidate only when declared', () => {\n    const passed = parseBallots('1,Write-in>A\\n2,A', ['A', 'B']);\n    expect(passed.candidates).toEqual(['A', 'B']);\n    expect(passed.ballots[0].marks[0]).toEqual({ kind: 'candidate', name: 'Write-in' });\n    const discovered = parseBallots('1,Write-in>A\\n2,A');\n    expect(discovered.candidates).toEqual(['A']);\n    const counted = parseBallots('3,Write-in\\n2,A', ['Write-in', 'A']);\n    expect(counted.candidates).toEqual(['Write-in', 'A']);\n  });\n  it('ignores comment lines', () => { expect(parseBallots('# header\\n2,A').ballots).toHaveLength(1); });\n});\n"},"test/alaska.parity.test.ts":{"tests":[{"id":"154","name":"Alaska 2022 special — certified parity from official CVR T23 round 1 matches certified exactly"},{"id":"155","name":"Alaska 2022 special — certified parity from official CVR T24 final round matches certified exactly, including exhausted 11,243"},{"id":"156","name":"Alaska 2022 special — certified parity from official CVR T25 Begich transfer split matches the official transfer table"},{"id":"157","name":"Alaska 2022 special — certified parity from official CVR duplicate-as-ignored (the other convention) does NOT match — the rule matters"}],"source":"import { describe, it, expect } from 'vitest';\nimport { tabulateIrv, dominionCategories } from '../src/index.js';\nimport { ALASKA_2022_SPECIAL as E } from '../src/elections/alaska-2022-special.js';\ndescribe('Alaska 2022 special — certified parity from official CVR', () => {\n  const r = tabulateIrv(E.load(), E.candidates, E.rules);\n  it('T23 round 1 matches certified exactly', () => {\n    expect(r.totalBallots).toBe(E.certified.totalBallots); expect(r.rounds[0].tallies).toEqual(E.certified.rounds[0].tallies);\n    const c = dominionCategories(r.rounds, 0); expect(c).toEqual({ blanks: 3412, exhausted: 0, overvotes: 295, continuing: 188582 });\n    expect(r.rounds[0].eliminated).toEqual(['Begich, Nick']);\n  });\n  it('T24 final round matches certified exactly, including exhausted 11,243', () => {\n    expect(r.rounds.length).toBe(2); expect(r.rounds[1].tallies).toEqual(E.certified.rounds[1].tallies); expect(r.winner).toBe('Peltola, Mary S.');\n    expect(dominionCategories(r.rounds, 1)).toEqual({ blanks: 3412, exhausted: 11243, overvotes: 342, continuing: 177292 });\n  });\n  it('T25 Begich transfer split matches the official transfer table', () => {\n    const d = r.rounds[1].transfers!; const c1 = dominionCategories(r.rounds, 1);\n    expect(d).toEqual({ 'Palin, Sarah': 27053, 'Peltola, Mary S.': 15467 });\n    expect(c1.exhausted).toBe(E.certified.begichTransfers.exhausted); expect(c1.overvotes - 295).toBe(E.certified.begichTransfers.overvotes);\n    expect(27053 + 15467 + 11243 + 47).toBe(53810);\n  });\n  it('duplicate-as-ignored (the other convention) does NOT match — the rule matters', () => {\n    const s = tabulateIrv(E.load(), E.candidates, { ...E.rules, duplicates: 'ignore' });\n    expect(s.rounds[1].tallies).not.toEqual(E.certified.rounds[1].tallies);\n  });\n});\n"},"test/irv-reasons.test.ts":{"tests":[{"id":"158","name":"inactive reasons and duplicate conventions every-rank-marked ballot is \"exhausted\"; one blank rank makes it \"undervote\""},{"id":"159","name":"inactive reasons and duplicate conventions duplicates=skip: A>A>_>B exhausts under two-skip; duplicates=ignore continues to B"},{"id":"160","name":"inactive reasons and duplicate conventions non-continuing (excluded) write-in is passed over without counting as a skip"}],"source":"import { describe, it, expect } from 'vitest';\nimport { parseBallots, tabulateIrv } from '../src/index.js';\ndescribe('inactive reasons and duplicate conventions', () => {\n  it('every-rank-marked ballot is \"exhausted\"; one blank rank makes it \"undervote\"', () => {\n    const { ballots } = parseBallots('5,A\\n4,B\\n1,C>C>C\\n1,C>_>C');\n    const r = tabulateIrv(ballots, ['A', 'B', 'C']);\n    expect(r.rounds[1].inactive.exhausted).toBe(1); expect(r.rounds[1].inactive.undervote).toBe(1); expect(r.rounds[1].tallies).toEqual({ A: 5, B: 4 });\n  });\n  it('duplicates=skip: A>A>_>B exhausts under two-skip; duplicates=ignore continues to B', () => {\n    const f = '3,X\\n2,Y\\n1,A>A>_>Y';\n    const sk = tabulateIrv(parseBallots(f).ballots, ['X', 'Y', 'A'], { skips: 'two-exhaust', duplicates: 'skip' });\n    const ig = tabulateIrv(parseBallots(f).ballots, ['X', 'Y', 'A'], { skips: 'two-exhaust', duplicates: 'ignore' });\n    expect(sk.rounds[1].tallies).toEqual({ X: 3, Y: 2 }); expect(sk.rounds[1].inactive.skips).toBe(1);\n    expect(ig.rounds[1].tallies).toEqual({ X: 3, Y: 3 });\n  });\n  it('non-continuing (excluded) write-in is passed over without counting as a skip', () => {\n    const r = tabulateIrv(parseBallots('3,X\\n2,Y\\n1,Write-in>_>Y').ballots, ['X', 'Y'], { skips: 'two-exhaust' });\n    expect(r.rounds[0].tallies).toEqual({ X: 3, Y: 3 }); expect(r.rounds[0].inactive.skips).toBe(0);\n    const r2 = tabulateIrv(parseBallots('3,X\\n2,Y\\n1,Write-in>_>_>Y').ballots, ['X', 'Y'], { skips: 'two-exhaust' });\n    expect(r2.rounds[0].tallies).toEqual({ X: 3, Y: 2 }); expect(r2.rounds[0].inactive.skips).toBe(1);\n  });\n});\n"},"test/elections.api.test.ts":{"tests":[{"id":"161","name":"GET /api/elections lists the three bundled elections with the public metadata fields"},{"id":"162","name":"GET /api/elections matches certified candidate lists, ballot counts, and winners"},{"id":"163","name":"GET /api/elections 405 with Allow: GET on other methods"}],"source":"import { describe, it, expect } from 'vitest';\nimport { handleElectionList } from '../src/elections/http.js';\nimport { ALASKA_2022_SPECIAL } from '../src/elections/alaska-2022-special.js';\nimport { MAINE_2018_CD2 } from '../src/elections/maine-2018-cd2.js';\nimport { NYC_2021_DEM_MAYOR } from '../src/elections/nyc-2021-dem-mayor.js';\n\ndescribe('GET /api/elections', () => {\n  const res = handleElectionList('GET');\n  const elections = (res.body as { elections: Record<"+"string, unknown>[] }).elections;\n\n  it('lists the three bundled elections with the public metadata fields', () => {\n    expect(res.status).toBe(200);\n    expect(elections.map(e => e.id)).toEqual(['maine-2018-cd2', 'alaska-2022', 'nyc-2021']);\n    for (const e of elections) {\n      expect(Object.keys(e).sort()).toEqual([\n        'ballotCount', 'candidates', 'certifiedWinner', 'id', 'jurisdiction', 'method', 'name', 'seats', 'source', 'year',\n      ]);\n      expect(e.method).toBe('IRV');\n      expect(e.seats).toBe(1);\n      expect(typeof e.source).toBe('string');\n      expect(String(e.source)).toMatch(/^https:\\/\\//);\n    }\n  });\n\n  it('matches certified candidate lists, ballot counts, and winners', () => {\n    const [maine, alaska, nyc] = elections;\n    expect(maine.name).toBe(MAINE_2018_CD2.title);\n    expect(maine.jurisdiction).toBe('Maine');\n    expect(maine.year).toBe(2018);\n    expect(maine.candidates).toEqual(MAINE_2018_CD2.candidates);\n    expect(maine.ballotCount).toBe(MAINE_2018_CD2.certified.totalBallots);\n    expect(maine.certifiedWinner).toBe('DEM Golden, Jared F.');\n    expect(maine.source).toBe('https://www.maine.gov/sos/cec/elec/results/2018/updated-summary-report-CD2.xls');\n\n    expect(alaska.name).toBe(ALASKA_2022_SPECIAL.title);\n    expect(alaska.jurisdiction).toBe('Alaska');\n    expect(alaska.year).toBe(2022);\n    expect(alaska.candidates).toEqual(ALASKA_2022_SPECIAL.candidates);\n    expect(alaska.ballotCount).toBe(ALASKA_2022_SPECIAL.certified.totalBallots);\n    expect(alaska.certifiedWinner).toBe('Peltola, Mary S.');\n    expect(alaska.source).toBe('https://www.elections.alaska.gov/results/22SSPG/');\n\n    expect(nyc.name).toBe(NYC_2021_DEM_MAYOR.title);\n    expect(nyc.jurisdiction).toBe('New York City');\n    expect(nyc.year).toBe(2021);\n    expect(nyc.candidates).toEqual(NYC_2021_DEM_MAYOR.candidates);\n    expect(nyc.ballotCount).toBe(947932);\n    expect(nyc.certifiedWinner).toBe('Eric L. Adams');\n    expect(nyc.source).toBe('https://vote.nyc/page/election-results-summary');\n  });\n\n  it('405 with Allow: GET on other methods', () => {\n    const r = handleElectionList('POST');\n    expect(r.status).toBe(405);\n    expect(r.headers).toEqual({ Allow: 'GET' });\n    expect(r.body).toEqual({ error: { code: 'METHOD_NOT_ALLOWED', message: 'Method not allowed', details: null } });\n  });\n});\n"}},"projectRoot":"/tmp/mut","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","testRunner":"vitest","plugins":["@stryker-mutator/vitest-runner"],"mutate":["src/parse.ts"],"reporters":["clear-text","html","json"],"htmlReporter":{"fileName":"audit/mutation/latest.html"},"jsonReporter":{"fileName":"audit/mutation/latest.json"},"coverageAnalysis":"perTest","concurrency":4,"timeoutMS":60000,"tempDirName":".stryker-tmp","tsconfigFile":"no-tsconfig-for-stryker.json","disableTypeChecks":false,"allow
