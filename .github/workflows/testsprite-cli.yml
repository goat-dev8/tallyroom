# TestSprite CLI gate on pull requests: runs only the API tests a PR can affect, against that PR's Vercel preview.
# (The UI suite already runs on every PR through the TestSprite V3 GitHub check, so this gate does not repeat it.)
# Vercel does not create GitHub Deployments for this project, so deployment_status never fires; instead this
# waits for the Vercel commit status on the PR head, then targets the branch alias
# https://tallyroom-git-<branch-slug>-goats-projects-3f023cc9.vercel.app (keep branch names <= 24 chars).
# Suite choice: scripts/testsprite-filter.mjs. Output: JUnit per suite (artifact) + job summary.
name: TestSprite CLI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: read

# One group across this workflow and testsprite-prod.yml: the API tests' stored code is shared, so binding
# a base URL and running must never interleave between two callers.
concurrency:
  group: testsprite-api-bound
  cancel-in-progress: false

jobs:
  testsprite-cli:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pick API suites from the PR's changed paths
        id: pick
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > changed.txt
          node scripts/testsprite-filter.mjs < changed.txt | grep '^api:' > suites.txt || true
          { echo "### TestSprite CLI suite selection (PR #$PR)"; echo; echo '```'; cat changed.txt; echo '```'; echo
            if [ -s suites.txt ]; then echo "Suites: $(cut -d' ' -f1 suites.txt | tr '\n' ' ')"; else echo "Suites: none (no API-affecting change; UI is covered by the TestSprite V3 check)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -s suites.txt ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Wait for this commit's Vercel preview
        id: preview
        if: steps.pick.outputs.run == 'true'
        run: |
          for i in $(seq 90); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.statuses[] | select(.context=="Vercel")][0] | "\(.state)|\(.description)"' 2>/dev/null || echo "missing|")
            case "$st" in success*|failure*|error*) break;; esac
            sleep 10
          done
          case "$st" in
            success*Ignored*|success*Canceled*)
              # CI/docs-only change: ignoreCommand skipped the preview (no deploy spent). The app code equals main,
              # so the API suite runs against production instead.
              url="https://tallyroom-rosy.vercel.app"; echo "::notice::Preview skipped by ignoreCommand ($st); testing production, which runs this PR's app code." ;;
            success*)
              slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
              url="https://tallyroom-git-${slug}-goats-projects-3f023cc9.vercel.app" ;;
            *) echo "::error::No usable Vercel preview for $SHA ($st)"; exit 1 ;;
          esac
          curl -sf -o /dev/null "$url/api/health" || { echo "::error::$url/api/health is not reachable (a slug over 24 chars gets truncated by Vercel)"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"; echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the TestSprite CLI
        if: steps.pick.outputs.run == 'true'
        run: npm i -g @testsprite/testsprite-cli@latest

      - name: Run TestSprite API tests on this PR's preview
        if: steps.pick.outputs.run == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          if [ -z "$TESTSPRITE_API_KEY" ]; then echo "::warning::TESTSPRITE_API_KEY secret is not set; skipping the CLI gate."; exit 0; fi
          mkdir -p reports
          # Binds PREVIEW_URL into each stored backend test (free), then one `testsprite ci run --filter api:` with JUnit.
          node scripts/testsprite-api.mjs --base "$PREVIEW_URL" --junit reports/testsprite-api.xml

      - name: Upload JUnit reports
        if: always() && hashFiles('reports/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-junit
          path: reports/
